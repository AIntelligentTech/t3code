/* ── deck controller ────────────────────────────────────────────────────
   Wired on view activation rather than at load, because a deck inside a hidden
   view has no layout: IntersectionObserver would fire for every slide at once
   against a zero-height root and mark the whole deck seen before it is read. */
var decksReady = {};
function initDeck(node){
  var deck = node.querySelector('[data-deck]');
  if (!deck) return;
  var id = deck.getAttribute('data-deck');
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.dkslide'));
  if (!slides.length) return;

  var fill = deck.querySelector('[data-dkfill="' + id + '"]');
  var at = deck.querySelector('[data-dkat="' + id + '"]');
  var dots = Array.prototype.slice.call(deck.querySelectorAll('[data-dkgo="' + id + '"]'));

  function mark(i){
    if (at) at.textContent = String(i + 1);
    if (fill) fill.style.width = ((i + 1) / slides.length * 100) + '%';
    dots.forEach(function(d, j){ d.classList.toggle('on', j === i); });
  }

  // Size the deck to whatever is actually left below it. A CSS constant cannot
  // know: the topbar wraps at narrow widths and the offset moves, which left the
  // page scrollable behind a deck that was supposed to own the viewport.
  function fit(){
    if (window.innerWidth <= 700) { deck.style.height = ''; return; }
    var top = deck.getBoundingClientRect().top;
    deck.style.height = Math.max(320, window.innerHeight - Math.round(top)) + 'px';
  }

  // Re-fit on EVERY activation — the offset above the deck depends on chrome
  // that may have reflowed while another view was showing. Bind the listener
  // and the handlers ONCE: initDeck runs on every view switch, so binding
  // outside the guard registered another resize listener each time the reader
  // came back to the deck.
  fit();
  if (decksReady[id]) return;
  decksReady[id] = true;
  window.addEventListener('resize', fit);

  dots.forEach(function(d){
    d.addEventListener('click', function(){
      var i = +d.getAttribute('data-i');
      if (slides[i]) slides[i].scrollIntoView({ block: 'start' });
    });
  });

  // Reveal on entry, and report position from the same signal — one observer,
  // so the chrome can never disagree with what is on screen.
  if (typeof IntersectionObserver === 'function'){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        e.target.classList.add('seen');
        mark(+e.target.getAttribute('data-dki'));
      });
    }, { root: deck, threshold: 0.55 });
    slides.forEach(function(sl){ io.observe(sl); });
  } else {
    slides.forEach(function(sl){ sl.classList.add('seen'); });
  }
  mark(0);
  slides[0].classList.add('seen');
}

/* ── outline rail ─────────────────────────────────────────
   The current view's sections as ticks in the margin (see runtime.css). Built
   from the rendered markup rather than the payload so every view type — a
   ledger, a questionnaire, a docs corpus — gets one for free, and hidden when
   a view has fewer than two sections or a document is open. */
var outlineTargets = [];
function outlineItems(node){
  var out = [];
  // Sections at depth 1 (nested ones at 2), then the titled things inside
  // each — a chart's title, a table's or a card set's caption, a callout's
  // title — at depth 2, so a view with one long section still has a map.
  var seq = 0;
  function mint(el, prefix){ if (!el.id) el.id = prefix + '-' + (++seq); return el.id; }
  var TITLED = '.chartbox > h4, .tw + .cap, .callout .ct';
  function titled(scope, owner, depth){
    Array.prototype.forEach.call(scope.querySelectorAll(TITLED), function(t){
      if (t.closest('section.blk') !== owner) return;
      var target = t.classList.contains('cap') ? t.previousElementSibling : t.closest('.chartbox, .callout') || t;
      var title = t.textContent.replace(/\s+/g, ' ').trim();
      if (!title) return;
      if (title.length > 48) title = title.slice(0, 46).replace(/\s+\S*$/, '') + '…';
      out.push({ id: mint(target, 'blk'), title: title, depth: depth, count: '', node: target });
    });
  }
  // A view with no sections still has titled blocks; they are its outline.
  if (!node.querySelector('section.blk')){ titled(node, null, 1); return out; }
  Array.prototype.forEach.call(node.querySelectorAll('section.blk'), function(s){
    var h = s.querySelector(':scope > .shead > h2');
    if (!h) return;
    var depth = s.parentNode && s.parentNode.closest && s.parentNode.closest('section.blk') ? 2 : 1;
    var count = s.querySelector(':scope > .shead > .snum');
    out.push({ id: mint(s, 'sec'), title: h.textContent, depth: depth, count: count ? count.textContent : '', node: s });
    if (depth === 2) return;
    titled(s, s, 2);
  });
  return out;
}
function renderOutline(node, docPath){
  var nav = document.getElementById('adt-outline');
  if (!nav) return;
  var items = docPath ? [] : outlineItems(node);
  outlineTargets = items;
  if (items.length < 2){ nav.hidden = true; nav.innerHTML = ''; return; }
  nav.hidden = false;
  nav.innerHTML = '<div class="oh">' + icon('list') + '<span class="ohl">On this page</span></div>' + items.map(function(it){
    return '<button type="button" data-outline="' + esc(it.id) + '" class="d' + it.depth + '"><span class="tick" aria-hidden="true"></span>' +
      '<span class="ol">' + esc(it.title) + (it.count ? '<span class="n">' + esc(it.count) + '</span>' : '') + '</span></button>';
  }).join('');
  markOutline();
}
function markOutline(){
  if (!outlineTargets.length) return;
  var line = 140, cur = outlineTargets[0];
  for (var i = 0; i < outlineTargets.length; i++){
    if (outlineTargets[i].node.getBoundingClientRect().top <= line) cur = outlineTargets[i];
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-outline]'), function(b){
    if (b.getAttribute('data-outline') === cur.id) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
  });
}
var outlineTick = false;
window.addEventListener('scroll', function(){
  if (outlineTick) return;
  outlineTick = true;
  requestAnimationFrame(function(){ outlineTick = false; markOutline(); });
}, { passive: true });
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-outline]'); if (!b) return;
  var t = document.getElementById(b.getAttribute('data-outline'));
  if (!t) return;
  // A collapsed section opens before the scroll, so the rail never lands the
  // reader on a header with nothing under it.
  if (t.getAttribute('data-collapsed') === '1') setFold(t, true);
  t.scrollIntoView({ block: 'start', behavior: 'smooth' });
});

var current = null;
function show(id, docPath){
  var v = VIEWS.filter(function(x){ return x.id === id; })[0] || VIEWS[0];
  if (!v) return;
  current = v.id;
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(n){ n.classList.remove('on'); });
  var node = document.getElementById('view-' + v.id);
  if (!node) return;
  node.classList.add('on');
  document.body.classList.toggle('deck-mode', v.type === 'deck' && !docPath);
  initDeck(node);
  // State lives in ARIA, not in a class: aria-current is what the dock styles
  // and what a reader or a test can observe.
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function(b){
    var on = b.getAttribute('data-nav') === v.id;
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });
  var fr = node.querySelector('[data-filereader]'); if (fr){ fr.innerHTML = ''; fr.style.display = 'none'; }
  if (docPath){
    var holder = node.querySelector('[data-docreader]');
    if (!holder){ holder = el('div'); holder.setAttribute('data-docreader', '1'); node.appendChild(holder); }
    Array.prototype.forEach.call(node.children, function(c){ if (c !== holder) c.style.display = 'none'; });
    holder.style.display = '';
    holder.innerHTML = renderDoc(docPath);
  } else {
    var h2 = node.querySelector('[data-docreader]');
    if (h2){ h2.innerHTML = ''; h2.style.display = 'none'; }
    Array.prototype.forEach.call(node.children, function(c){ if (!c.hasAttribute('data-docreader') && !c.hasAttribute('data-filereader')) c.style.display = ''; });
  }
  renderPending(node);
  renderOutline(node, docPath);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
// `#/<view>/@<id>` shows the view, opens every fold around the element and
// scrolls to it — the cross-tab link a workstream uses to reach the exact
// ledger entry, feature or milestone rather than the top of a tab.
function jumpTo(id){
  var t = document.getElementById(id); if (!t) return;
  var sec = t.closest ? t.closest('section.fold') : null;
  while (sec){ if (sec.getAttribute('data-collapsed') === '1') setFold(sec, true); sec = sec.parentNode && sec.parentNode.closest ? sec.parentNode.closest('section.fold') : null; }
  if (t.hasAttribute('data-folded')){ var u = t.parentNode.querySelector('[data-unfold]'); if (u && u.getAttribute('aria-expanded') !== 'true') u.click(); }
  requestAnimationFrame(function(){ t.scrollIntoView({ block: 'start', behavior: 'smooth' }); t.classList.add('jumped'); setTimeout(function(){ t.classList.remove('jumped'); }, 1600); });
}
function route(){
  var h = (location.hash || '').replace(/^#\/?/, '');
  var parts = h.split('/');
  var tail = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : null;
  if (tail && tail.charAt(0) === '@'){ show(parts[0] || (VIEWS[0] && VIEWS[0].id), null); jumpTo(tail.slice(1)); return; }
  show(parts[0] || (VIEWS[0] && VIEWS[0].id), tail);
}

/* ── search ────────────────────────────────────────────── */
var INDEX = [];
function buildIndex(){
  function push(viewId, kind, title, text, hash){
    if (!text) return;
    INDEX.push({ v:viewId, kind:kind, title:title, text:String(text), hash:hash || ('#/' + viewId) });
  }
  function walk(v, bs){
    (bs || []).forEach(function(b){
      if (!b) return;
      if (b.type === 'section'){ push(v.id, 'section', b.title, b.title); walk(v, b.blocks); }
      else if (b.type === 'row'){ walk(v, b.blocks); }
      else if (b.type === 'prose') push(v.id, 'prose', v.nav, b.md);
      else if (b.type === 'verdict') push(v.id, 'verdict', v.nav, b.text);
      else if (b.type === 'callout') push(v.id, 'callout', b.title || v.nav, (b.title || '') + ' ' + b.text);
      else if (b.type === 'table') (b.rows || []).forEach(function(r){ push(v.id, 'table', v.nav, Object.keys(r).map(function(k){ return r[k]; }).join(' ')); });
      else if (b.type === 'cards') (b.cards || []).forEach(function(c){ push(v.id, 'card', c.title, [c.title, c.subtitle, c.body].join(' ')); });
      else if (b.type === 'timeline') (b.events || []).forEach(function(e){ push(v.id, 'event', e.title, [e.when, e.title, e.body].join(' ')); });
      else if (b.type === 'docs') (b.docs || []).forEach(function(d){ push(v.id, 'doc', d.title, d.title + ' ' + d.md, '#/' + v.id + '/' + encodeURIComponent(d.path)); });
      else if (b.type === 'code' || b.type === 'ascii') push(v.id, 'code', v.nav, b.text);
      else if (b.type === 'drafts') (b.items || []).forEach(function(it){ push(v.id, 'draft', it.title, [it.title, it.summary || '', it.md || ''].concat((it.drafts || []).map(function(d){ return d.text; })).join(' ')); });
      else if (b.type === 'media' || b.type === 'demo'){
        push(v.id, b.type, b.alt, [b.alt, b.caption || ''].join(' '));
        (b.chapters || b.steps || []).forEach(function(x){
          push(v.id, 'beat', x.title, [x.title, x.note || ''].join(' '));
        });
      }
    });
  }
  VIEWS.forEach(function(v){
    push(v.id, 'view', v.title, v.title + ' ' + (v.subtitle || ''));
    walk(v, v.blocks);
    if (v.intro) walk(v, [v.intro]);
    (v.questions || []).forEach(function(q){
      push(v.id, 'question', q.topic, [q.id, q.topic, q.context, (q.options || []).map(function(o){ return o.label + ' ' + o.summary + ' ' + (o.detail || ''); }).join(' ')].join(' '));
    });
    (v.decisions || []).forEach(function(d){ push(v.id, 'decision', d.topic, [d.topic, d.decision, d.why, d.contradicts].join(' ')); });
    (v.items || []).forEach(function(it){ push(v.id, 'evidence', it.claim, [it.claim, it.command, it.output, it.verdict].join(' ')); });
    (v.docs || []).forEach(function(d){ push(v.id, 'doc', d.title, d.title + ' ' + d.md, '#/' + v.id + '/' + encodeURIComponent(d.path)); });
  });
}
function search(term){
  var res = document.getElementById('adt-res');
  var q = term.trim().toLowerCase();
  if (q.length < 2){ res.classList.remove('on'); res.innerHTML = ''; return; }
  var hits = [];
  for (var i = 0; i < INDEX.length && hits.length < 40; i++){
    var it = INDEX[i], pos = it.text.toLowerCase().indexOf(q);
    if (pos === -1) continue;
    var from = Math.max(0, pos - 60), snippet = it.text.slice(from, pos + 120);
    hits.push({ it:it, snippet:(from > 0 ? '…' : '') + snippet, pos:pos - from });
  }
  if (!hits.length){ res.innerHTML = '<div class="rItem"><p>No match.</p></div>'; res.classList.add('on'); return; }
  res.innerHTML = hits.map(function(h){
    var s = esc(h.snippet);
    var marked = s.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\<!--ADT:JS-->') + ')', 'ig'), '<mark>$1</mark>');
    return '<div class="rItem" data-go="' + esc(h.it.hash) + '"><b>' + esc(h.it.kind) + ' · ' + esc(h.it.title) + '</b><p>' + marked + '</p></div>';
  }).join('');
  res.classList.add('on');
}

document.addEventListener('click', function(e){

  var cc = t.closest('[data-copycode]');

    var pre = cc.parentNode.querySelector('pre');

    return;
  }

  var copy = t.closest('[data-copy]');
  if (copy){
    var v = VIEWS.filter(function(x){ return x.id === copy.getAttribute('data-copy'); })[0];
    if (!v) return;
    var payload = collect(v);
    var text = 'Here are my responses to the ' + (v.round != null ? 'round ' + v.round + ' ' : '') +
      'questionnaire in ' + (META.title || 'the dashboard') + '. Ingest them with `report answers`, ' +
      'report the answered count, and do not proceed while a load-bearing question is unanswered.\n\n' +
      '```json\n' + JSON.stringify(payload, null, 2) + '\n```';
    copyOut(copy, text, payload.counts);
    return;
  }

  var clear = t.closest('[data-clear]');
  if (clear){
    var vid = clear.getAttribute('data-clear');
    if (confirm('Clear every answer in this questionnaire?')){
      try { localStorage.removeItem(SKEY + ':' + vid); } catch (e2) {}
      renderViews(); route();
    }

  }
});

/* ── stage interaction: seek to a beat, scrub a frame set ──
   One handler for all three stage kinds. Seeking is the whole point of the beat
   list: a reviewer criticises beat 4, and clicking beat 4 has to land there. */
function markCurrent(btn){
  var list = btn.closest('.beats');
  if (list) Array.prototype.forEach.call(list.querySelectorAll('.beat'), function(x){ x.removeAttribute('aria-current'); });
  btn.setAttribute('aria-current', 'true');
}
function showFrame(id, i){
  var b = MEDIA[id]; if (!b || !b.frames) return;
  i = Math.max(0, Math.min(b.frames.length - 1, i | 0));
  var f = b.frames[i];
  var img = document.querySelector('[data-frameimg="' + id + '"]');
  var at = document.querySelector('[data-frameat="' + id + '"]');
  var rng = document.querySelector('[data-framerange="' + id + '"]');
  var src = mediaSrc(f.src);
  if (img && src) img.src = src;
  if (at) at.textContent = fmtT(f.t);
  if (rng && +rng.value !== i) rng.value = String(i);
}
/** Nearest frame at or before t — frames are irregularly spaced, so an index
 *  computed from a nominal frame rate would land on the wrong moment. */
function frameIndexAt(b, t){
  var i = 0;
  for (var k = 0; k < b.frames.length; k++){ if (b.frames[k].t <= t) i = k; else break; }
  return i;
}
document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-seek]');
  if (!btn || btn.hasAttribute('disabled')) return;
  var id = btn.getAttribute('data-seek'), t = +btn.getAttribute('data-t'), kind = btn.getAttribute('data-kind');
  var b = MEDIA[id]; if (!b) return;
  markCurrent(btn);
  if (kind === 'frames'){ showFrame(id, frameIndexAt(b, t)); return; }
  if (kind === 'demo'){
    var inst = DEMO[id];
    if (inst && typeof inst.goto === 'function'){ try { inst.goto(t, false); } catch (err) {} }
    return;
  }
  var vid = document.querySelector('[data-video="' + id + '"]');
  if (vid){ try { vid.currentTime = t / 1000; } catch (err) {} }
});

document.addEventListener('change', function(e){

document.addEventListener('keydown', function(e){

/* ── panels: the file explorer and the dev servers ───────────────────────
   Both live outside the views, so they persist across tabs, and both squeeze
   the content rather than covering it (body.with-pane-l / -r pad the
   frame). They need the loopback server: the API is same-origin only, so a
   page opened from file:// is told to open through `report open` instead. */
var SERVER = (function(){
  var src = document.currentScript && document.currentScript.src;
  try { if (src && /^https?:/.test(src)) return new URL(src).origin; } catch (e) {}

})();
var API_OK = !!SERVER && location.origin === SERVER;

  var o = opts || {};
  return fetch(SERVER + path, { method: o.method || 'GET', headers: { 'x-adt-serve': '1', 'content-type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
}
function noServer(){
  var here = location.protocol === 'file:' ? decodeURIComponent(location.pathname) : 'this file';
  return '<div class="pnote">The explorer and the dev servers need this page served by <code>report serve</code>. Run <code>report open ' + esc(here) + '</code> and use the page it opens.</div>';
}
function setPane(side, on){
  document.body.classList.toggle('with-pane-' + side, on);
  var el = document.getElementById(side === 'l' ? 'adt-explorer' : 'adt-logs');
  if (el) el.hidden = !on;
  if (side === 'l'){ try { localStorage.setItem('adt:pane:explorer', on ? '1' : '0'); } catch (e) {} var fb = document.getElementById('adt-filesbtn'); if (fb) fb.setAttribute('aria-pressed', on ? 'true' : 'false'); }

/* Which worktree the explorer shows: 0 is the main checkout; the rest are
   whatever git lists — .claude, .codex and ~/.t3 worktrees alike. */
var WT = (function(){ try { return Number(localStorage.getItem('adt:explorer:wt') || 0) || 0; } catch (e) { return 0; } })();

function renderWorktreeSelect(){

    var sel = document.getElementById('adt-wt');
    if (!sel){ sel = document.createElement('select'); sel.id = 'adt-wt'; sel.setAttribute('aria-label', 'Worktree'); head.insertBefore(sel, head.querySelector('.pclose')); }
    var KIND = { main: 'main checkout', claude: '.claude', codex: '.codex', t3: '.t3', other: 'elsewhere' };
    var groups = {};
    list.forEach(function(w){ (groups[w.kind] = groups[w.kind] || []).push(w); });
    sel.innerHTML = ['main', 'claude', 'codex', 't3', 'other'].filter(function(k){ return groups[k]; }).map(function(k){
      return '<optgroup label="' + esc(KIND[k]) + ' · ' + groups[k].length + '">' + groups[k].map(function(w){
        return '<option value="' + w.index + '"' + (w.index === WT ? ' selected' : '') + '>' + esc(w.branch || 'detached ' + String(w.head || '').slice(0, 7)) + ' — ' + esc(w.path.replace(/^.*\//, '')) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    if (!list[WT]){ WT = 0; sel.value = '0'; }
  }).catch(function(){});
}
function rememberTree(){ try { localStorage.setItem('adt:explorer:open', JSON.stringify(TREE_OPEN)); } catch (e) {} }
function fmtSize(n){ return n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
function renderDirInto(holder, rel){
  holder.innerHTML = '<div class="tload">…</div>';
  return api('/api/tree?path=' + encodeURIComponent(rel) + wtQuery()).then(function(d){
    holder.innerHTML = '<ul class="tree">' + d.entries.map(function(e){
      var p = (d.path ? d.path + '/' : '') + e.name;
      if (e.kind === 'dir'){
        var open = TREE_OPEN.indexOf(p) !== -1;
        return '<li class="tdir' + (open ? ' open' : '') + '" data-dir="' + esc(p) + '"><button type="button" class="tn" data-toggle="' + esc(p) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' + icon('chev', 'tc') + icon('folder') + '<span>' + esc(e.name) + '</span></button><div class="tkids"' + (open ? '' : ' hidden') + '></div></li>';
      }
      return '<li class="tfile"><button type="button" class="tn" data-file="' + esc(p) + '">' + icon('file') + '<span>' + esc(e.name) + '</span><em>' + esc(fmtSize(e.size)) + '</em></button></li>';
    }).join('') + '</ul>';
    Array.prototype.forEach.call(holder.querySelectorAll('.tdir.open > .tkids'), function(k){ renderDirInto(k, k.parentNode.getAttribute('data-dir')); });
  }).catch(function(err){ holder.innerHTML = '<div class="pnote">' + esc(err.message) + '</div>'; });
}
function openExplorer(on){
  setPane('l', on);
  if (!on) return;
  var tree = document.getElementById('adt-tree');
  var title = document.getElementById('adt-explorer-title');
  if (title && META.repo) title.textContent = String(META.repo).replace(/^.*\//, '');
  if (!API_OK){ tree.innerHTML = noServer(); return; }
  if (!tree.hasAttribute('data-loaded')){ tree.setAttribute('data-loaded', '1'); renderWorktreeSelect(); renderDirInto(tree, ''); }
}
var IMG_RE = /\.(png|jpe?g|gif|webp|avif|svg)$/i, TEXT_MAX = 400000;
function openFile(rel){
  var node = document.querySelector('.view.on'); if (!node) return;
  var holder = node.querySelector('[data-filereader]');
  if (!holder){ holder = el('div'); holder.setAttribute('data-filereader', '1'); node.appendChild(holder); }
  Array.prototype.forEach.call(node.children, function(c){ if (c !== holder) c.style.display = 'none'; });
  holder.style.display = '';
  var crumb = '<div class="crumb"><button type="button" data-fileclose="1">← Back</button><span>' + esc(rel) + '</span></div>';
  var url = fileBase() + rel.split('/').map(encodeURIComponent).join('/');
  if (IMG_RE.test(rel)){ holder.innerHTML = crumb + '<figure class="stage"><div class="screen"><img src="' + esc(url) + '" alt="' + esc(rel) + '"></div></figure>'; return; }
  holder.innerHTML = crumb + '<div class="tload">…</div>';
  fetch(url).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function(text){
    var body = text.length > TEXT_MAX ? text.slice(0, TEXT_MAX) + '\n… (' + fmtSize(text.length) + ', truncated)' : text;
    holder.innerHTML = crumb + (/\.md$/i.test(rel) ? '<div class="prose w-full">' + md(body) + '</div>' : '<pre class="code">' + esc(body) + '</pre>') +
      '<p class="cap">' + esc(fmtSize(text.length)) + ' · ' + esc(text.split('\n').length + ' lines') + '</p>';
  }).catch(function(err){ holder.innerHTML = crumb + '<div class="callout t-danger"><p>' + esc(err.message) + '</p></div>'; });
  window.scrollTo({ top: 0 });
}
function closeFile(){
  var node = document.querySelector('.view.on'); if (!node) return;
  var holder = node.querySelector('[data-filereader]'); if (holder){ holder.innerHTML = ''; holder.style.display = 'none'; }
  Array.prototype.forEach.call(node.children, function(c){ if (!c.hasAttribute('data-filereader') && !c.hasAttribute('data-docreader')) c.style.display = ''; });
}

/* the dev servers */
var DEV = { open: false, timer: null, current: null, abort: null };
function devDot(st){ return '<span class="ddot ' + (st === 'running' ? 'run' : st === 'failed' ? 'bad' : 'off') + '" aria-hidden="true"></span>'; }
function renderDevMenu(){
  var m = document.getElementById('adt-devmenu'); if (!m) return;
  if (!API_OK){ m.innerHTML = noServer(); return; }
  Promise.all([api('/api/commands'), api('/api/instances')]).then(function(r){
    var cmds = r[0].commands, inst = r[1];
    var running = inst.filter(function(i){ return i.status === 'running'; }), done = inst.filter(function(i){ return i.status !== 'running'; });
    var row = function(i){
      return '<div class="drow2" data-inst="' + esc(i.id) + '">' + devDot(i.status) + '<span class="dn2">' + esc(i.name) + '</span>' +
        (i.port ? '<a class="dport" href="http://localhost:' + i.port + '" target="_blank" rel="noopener">:' + i.port + '</a>' : '<span class="dport">—</span>') +
        '<span class="dst">' + esc(i.status) + (i.exitCode != null ? ' ' + i.exitCode : '') + '</span>' +
        '<button type="button" class="btn" data-logs="' + esc(i.id) + '">Logs</button>' +
        (i.status === 'running' ? '<button type="button" class="btn" data-stop="' + esc(i.id) + '">' + icon('stop') + 'Stop</button>' : '') + '</div>';
    };
    m.innerHTML = '<div class="dh2">Dev servers<span class="dsub">' + (r[0].packageManager ? esc(r[0].packageManager) + ' · ' : '') + esc(String(META.repo || '').replace(/^.*\//, '')) + '</span></div>' +
      (running.length ? running.map(row).join('') : '<div class="pnote">Nothing running.</div>') +
      (done.length ? '<details class="ddone"><summary>' + done.length + ' finished</summary>' + done.map(row).join('') + '</details>' : '') +
      '<div class="dh2">Start</div>' + (cmds.length ? cmds.map(function(c){
        return '<div class="drow2 dcmd"><span class="dn2">' + esc(c.name) + '</span><code class="dcode" title="' + esc(c.command) + '">' + esc(c.command) + '</code>' +
          '<input type="number" min="1" max="65535" placeholder="port" aria-label="Port for ' + esc(c.name) + '" data-port-for="' + esc(c.name) + '">' +
          '<button type="button" class="btn primary" data-start="' + esc(c.name) + '">' + icon('play') + 'Start</button></div>';
      }).join('') : '<div class="pnote">No dev-shaped script (dev, start, serve, preview, storybook, watch) in package.json, and no <code>commands</code> in .adt-project.json.</div>');
  }).catch(function(err){ m.innerHTML = '<div class="pnote">' + esc(err.message) + '</div>'; });
}
function openDevMenu(on){
  DEV.open = on;
  var m = document.getElementById('adt-devmenu'), b = document.getElementById('adt-devbtn');
  if (m) m.hidden = !on; if (b) b.setAttribute('aria-expanded', on ? 'true' : 'false');
  clearInterval(DEV.timer); DEV.timer = null;
  if (on){ renderDevMenu(); DEV.timer = setInterval(renderDevMenu, 3000); }
}
function streamLogs(id){
  if (DEV.abort){ DEV.abort.abort(); DEV.abort = null; }
  var body = document.getElementById('adt-logbody'), title = document.getElementById('adt-logs-title'), meta = document.getElementById('adt-logs-meta'), stopBtn = document.getElementById('adt-logs-stop');
  DEV.current = id; body.textContent = ''; title.textContent = id; meta.textContent = '';
  api('/api/instances/' + encodeURIComponent(id)).then(function(i){
    title.textContent = i.name; meta.innerHTML = (i.port ? '<a href="http://localhost:' + i.port + '" target="_blank" rel="noopener">localhost:' + i.port + '</a> · ' : '') + esc(i.status);
    stopBtn.hidden = i.status !== 'running';
  }).catch(function(){});
  var ctl = new AbortController(); DEV.abort = ctl;
  fetch(SERVER + '/api/instances/' + encodeURIComponent(id) + '/logs', { headers: { 'x-adt-serve': '1' }, signal: ctl.signal }).then(function(r){
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    function pump(){
      return reader.read().then(function(x){
        if (x.done) return;
        buf += dec.decode(x.value, { stream: true });
        var parts = buf.split('\n\n'); buf = parts.pop();
        parts.forEach(function(ev){
          var isEnd = /^event: end/m.test(ev), data = /^data: (.*)$/m.exec(ev);
          if (isEnd){ meta.textContent = (meta.textContent || '').replace(/running$/, '') + 'ended'; stopBtn.hidden = true; return; }
          if (!data) return;
          try { var e = JSON.parse(data[1]); var line = document.createElement('span'); line.className = 'll ' + e.s; line.textContent = e.line + '\n'; body.appendChild(line); } catch (err) {}
        });
        var stick = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
        if (stick) body.scrollTop = body.scrollHeight;
        return pump();
      });
    }
    return pump();
  }).catch(function(){});
}
function openLogs(id){ setPane('r', true); streamLogs(id); }

document.addEventListener('click', function(e){
  var t = e.target;
  if (t.closest('#adt-filesbtn')){ openExplorer(document.body.classList.contains('with-pane-l') ? false : true); return; }
  if (t.closest('#adt-devbtn')){ openDevMenu(!DEV.open); return; }
  var pc = t.closest('[data-pane-close]');
  if (pc){ var side = pc.getAttribute('data-pane-close'); if (side === 'explorer') setPane('l', false); else { setPane('r', false); if (DEV.abort){ DEV.abort.abort(); DEV.abort = null; } } return; }
  var tg = t.closest('[data-toggle]');
  if (tg){
    var li = tg.parentNode, dir = tg.getAttribute('data-toggle'), kids = li.querySelector(':scope > .tkids'), open = !li.classList.contains('open');
    li.classList.toggle('open', open); tg.setAttribute('aria-expanded', open ? 'true' : 'false'); kids.hidden = !open;
    if (open){ if (TREE_OPEN.indexOf(dir) === -1) TREE_OPEN.push(dir); renderDirInto(kids, dir); } else { TREE_OPEN = TREE_OPEN.filter(function(d){ return d !== dir; }); kids.innerHTML = ''; }
    rememberTree(); return;
  }
  var f = t.closest('[data-file]'); if (f){ openFile(f.getAttribute('data-file')); return; }
  if (t.closest('[data-fileclose]')){ closeFile(); return; }
  var st = t.closest('[data-start]');
  if (st){
    var name = st.getAttribute('data-start'), pin = document.querySelector('[data-port-for="' + name + '"]');
    st.disabled = true;
    api('/api/instances', { method: 'POST', body: { name: name, port: pin && pin.value ? Number(pin.value) : null } })
      .then(function(i){ renderDevMenu(); openLogs(i.id); })
      .catch(function(err){ st.disabled = false; var m = document.getElementById('adt-devmenu'); var n = el('div', 'pnote t-danger', esc(err.message)); m.insertBefore(n, m.firstChild); });
    return;
  }
  var sp = t.closest('[data-stop]'); if (sp){ api('/api/instances/' + encodeURIComponent(sp.getAttribute('data-stop')), { method: 'DELETE' }).then(renderDevMenu).catch(function(){}); return; }
  var lg = t.closest('[data-logs]'); if (lg){ openLogs(lg.getAttribute('data-logs')); return; }
  if (t.id === 'adt-logs-stop' && DEV.current){ api('/api/instances/' + encodeURIComponent(DEV.current), { method: 'DELETE' }).then(function(){ t.hidden = true; renderDevMenu(); }).catch(function(){}); return; }
  if (DEV.open && !t.closest('.tools')) openDevMenu(false);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && DEV.open) openDevMenu(false); });
document.addEventListener('change', function(e){
  if (e.target.id !== 'adt-wt') return;
  WT = Number(e.target.value) || 0;
  try { localStorage.setItem('adt:explorer:wt', String(WT)); } catch (err) {}
  closeFile();
  renderDirInto(document.getElementById('adt-tree'), '');
});
(function initPanels(){
  // The panes and the dock's tools are created here, not in the shell markup:
  // the shell ships no static text (the no-static-content gate), and a page
  // built before this runtime existed gets them the moment it loads the
  // runtime, without a reshell.
  var dock = document.getElementById('adt-dock'), nav = document.getElementById('adt-nav');
  if (dock && nav && !document.getElementById('adt-filesbtn')){
    var tools = el('div', 'tools', '<button type="button" id="adt-filesbtn" aria-pressed="false" title="Files"></button><button type="button" id="adt-devbtn" aria-expanded="false" title="Dev servers"></button><div class="devmenu" id="adt-devmenu" hidden></div>');
    dock.insertBefore(tools, nav);
  }
  if (!document.getElementById('adt-explorer')){
    var ex = el('aside', 'pane pane-l', '<div class="ph"><span class="pt" id="adt-explorer-title">Files</span><button type="button" class="pclose" data-pane-close="explorer" aria-label="Close the file explorer">×</button></div><div class="pbody" id="adt-tree"></div>');
    ex.id = 'adt-explorer'; ex.setAttribute('aria-label', 'Files'); ex.hidden = true; document.body.appendChild(ex);
    var lg = el('aside', 'pane pane-r', '<div class="ph"><span class="pt" id="adt-logs-title">Logs</span><span class="pm" id="adt-logs-meta"></span><button type="button" class="btn" id="adt-logs-stop">Stop</button><button type="button" class="pclose" data-pane-close="logs" aria-label="Close the logs">×</button></div><pre class="pbody plog" id="adt-logbody"></pre>');
    lg.id = 'adt-logs'; lg.setAttribute('aria-label', 'Dev server logs'); lg.hidden = true; document.body.appendChild(lg);
  }
  var fb = document.getElementById('adt-filesbtn'), db = document.getElementById('adt-devbtn');
  if (fb) fb.innerHTML = icon('folder') + '<span class="nl">Files</span>';
  if (db) db.innerHTML = icon('play') + '<span class="nl">Dev</span>';
  var want = false; try { want = localStorage.getItem('adt:pane:explorer') === '1'; } catch (e) {}
  if (want) openExplorer(true);
})();

window.addEventListener('hashchange', route);
renderMasthead(); renderNav(); renderViews(); renderFoot(); buildIndex(); route();
})();
</script>
