.pickfilter:focus{ outline:none; border-color:var(--primary); }
.pickacts{ display:flex; gap:6px; }
.pickacts .btn{ font-size:11px; padding:5px 9px; }
.pickcount{ font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); white-space:nowrap; }
.pickcount b{ color:var(--text); }

.picklegend{ display:flex; gap:14px; flex-wrap:wrap; padding:8px 0; font-size:11.5px; color:var(--text-secondary); }
.picklegend .lg{ display:inline-flex; align-items:center; gap:5px; }
.picklegend svg{ width:12px; height:12px; }

.pickgrp{ margin:14px 0 0; }
.pickgrp > header{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:7px 0 5px; border-bottom:1px solid var(--border);
}
.pickgtoggle{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.pickgtoggle b{ font-family:var(--font-sans); font-size:13px; font-weight:600; }
.pickgnote{ font-size:11.5px; color:var(--text-muted); }
.pickgcount{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); }

.picklist{ list-style:none; margin:0; padding:0; }
.pickitem{ border-bottom:1px solid var(--border); }
.pickitem:last-child{ border-bottom:0; }
.pickitem > label{ display:flex; gap:9px; align-items:flex-start; padding:7px 4px; cursor:pointer; }
.pickitem > label:hover{ background:var(--surface); }
.pickitem input[type=checkbox]{ margin-top:3px; flex:none; accent-color:var(--primary); }
/* An unchecked row recedes rather than vanishing — the reader must still be
   able to see and reverse what they dropped. */
.pickitem input:not(:checked) ~ .pickmain{ opacity:.42; }
.pickitem input:not(:checked) ~ .pickmain b{ text-decoration:line-through; }
.pickmain{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 9px; min-width:0; }
.pickmain b{ font-family:var(--font-sans); font-size:13px; font-weight:600; }
.pickmeta{ font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); }
.picknote{ flex:1 1 100%; font-size:11.5px; color:var(--text-muted); line-height:1.45; }
.pickbadges{ display:inline-flex; gap:4px; flex-wrap:wrap; }
.pickbadge{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--text-secondary); background:var(--surface-raised);
  padding:1.5px 5px; border-radius:2px;
}
/* Tone rails the first cell, the same way a toned table row does. */
.pickitem.t-ok    { box-shadow:inset 2px 0 0 var(--success); }
.pickitem.t-warn  { box-shadow:inset 2px 0 0 var(--warn); }
.pickitem.t-danger{ box-shadow:inset 2px 0 0 var(--danger); }
.pickitem.t-info  { box-shadow:inset 2px 0 0 var(--info); }
.pickitem.t-accent{ box-shadow:inset 2px 0 0 var(--accent); }

.pickempty{ padding:18px 4px; color:var(--text-muted); font-size:13px; }
.pickfoot{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
.pickfoot .hint{ font-size:11.5px; color:var(--text-muted); flex:1 1 240px; }

@media (max-width:700px){
  .pickbar{ gap:7px; }
  .pickcount{ order:-1; width:100%; }
}
</style>

<div class="wrap">
  <header id="adt-masthead"></header>
  <main id="adt-views"></main>
  <footer class="foot" id="adt-foot"></footer>
</div>
<nav class="outline" id="adt-outline" aria-label="On this page" hidden></nav>
<nav class="dock" id="adt-dock" aria-label="Report views">
  <div class="brand" id="adt-brand"></div>

      if (box) box.innerHTML = '<div class="missing"><b>The diagram could not be drawn</b>' +
        esc(err && err.message ? err.message : 'the diagram engine could not be loaded') + '</div>';

}
function renderPending(root){
  if (needDemo) mountDemos(root);
  renderMermaidIn(root);
  if (needChart){
    var cvs = root.querySelectorAll('canvas[data-chart]:not([data-done])');
    if (cvs.length) ensureChart().then(function(){
      Array.prototype.forEach.call(cvs, function(c){
        c.setAttribute('data-done','1');
        try { new window.Chart(c.getContext('2d'), JSON.parse(c.getAttribute('data-chart'))); } catch (e) {}

/* ── the diagram lightbox ──────────────────────────────────
   An architecture diagram is drawn wide and read in a column, so in the page it
   is always either too small to read or scrolled sideways. The lightbox gives it
   the whole viewport and lets the reader drive: drag to pan, wheel or pinch to
   zoom about the pointer, double-click to zoom in, and the keyboard for all of
   it. The rendered SVG is CLONED rather than moved, so the page keeps its own
   copy and closing the lightbox cannot leave a hole where the diagram was.

   Zoom is applied as a transform on a wrapper rather than by resizing the SVG:
   an SVG re-laid-out at a new size re-runs its own text measurement, which is
   the failure renderMermaidIn exists to avoid. A transform scales what is
   already correct. */
var LBOX = null, LB = { k: 1, x: 0, y: 0, w: 0, h: 0, drag: null, opener: null };
var LB_MIN = 0.1, LB_MAX = 12;

function lbEnsure(){
  if (LBOX) return LBOX;
  var n = el('div', 'lbox');
  n.setAttribute('role', 'dialog');
  n.setAttribute('aria-modal', 'true');
  n.setAttribute('aria-label', 'Diagram');
  n.hidden = true;
  n.innerHTML =
    '<div class="lbbar">' +
      '<span class="lbtitle" data-lbtitle></span>' +
      '<span class="lbtools">' +
        '<button type="button" data-lbz="-1" title="Zoom out (-)">' + icon('zout') + '</button>' +
        '<span class="lbpct" data-lbpct>100%</span>' +
        '<button type="button" data-lbz="1" title="Zoom in (+)">' + icon('zin') + '</button>' +
        '<button type="button" data-lbfit title="Fit to the screen (0)">' + icon('fit') + '</button>' +
        '<button type="button" data-lbclose title="Close (Esc)">' + icon('close') + '</button>' +
      '</span>' +
    '</div>' +
    '<div class="lbstage" data-lbstage><div class="lbcanvas" data-lbcanvas></div></div>' +
    '<p class="lbhint">Drag to pan · scroll to zoom · double-click to zoom in · Esc to close</p>';
  document.body.appendChild(n);
  LBOX = n;
  lbWire(n);
  return n;
}

function lbApply(){
  var c = LBOX.querySelector('[data-lbcanvas]');
  c.style.transform = 'translate(' + LB.x + 'px,' + LB.y + 'px) scale(' + LB.k + ')';
  LBOX.querySelector('[data-lbpct]').textContent = Math.round(LB.k * 100) + '%';
}
function lbFit(){
  var st = LBOX.querySelector('[data-lbstage]').getBoundingClientRect();
  if (!LB.w || !LB.h || !st.width) return;
  var k = Math.min((st.width - 48) / LB.w, (st.height - 48) / LB.h);
  LB.k = Math.max(LB_MIN, Math.min(LB_MAX, k));
  LB.x = (st.width - LB.w * LB.k) / 2;
  LB.y = (st.height - LB.h * LB.k) / 2;
  lbApply();
}
// Zoom about a point in stage coordinates, so what is under the pointer stays there.
function lbZoom(k, px, py){
  var st = LBOX.querySelector('[data-lbstage]').getBoundingClientRect();
  if (px == null){ px = st.width / 2; py = st.height / 2; }
  k = Math.max(LB_MIN, Math.min(LB_MAX, k));
  LB.x = px - (px - LB.x) * (k / LB.k);
  LB.y = py - (py - LB.y) * (k / LB.k);
  LB.k = k;
  lbApply();
}

/* A diagram and a mockup are the same problem — something drawn at a size the
   column cannot give it — so they open in the same viewer. An image carries its
   natural size in naturalWidth; an SVG carries it in the viewBox. */
function lbMedia(box){
  // Only a drawn diagram or a real picture. Never a decorative glyph: an icon
  // is an <svg> too, and a selector that cannot tell them apart zooms a 16px
  // link mark to fill the screen. Measured on the garden-birbs Style tab,
  // where an interactive-mockup tile carries a link glyph and no picture.
  return box.querySelector('pre.mermaid > svg') || box.querySelector('.galshot > img') || null;
}
function lbOpen(box){
  var media = lbMedia(box);
  if (!media) return;
  var svg = media.tagName.toLowerCase() === 'svg' ? media : null;
  var img = svg ? null : media;
  var n = lbEnsure();
  var canvas = n.querySelector('[data-lbcanvas]');
  var clone, r;
  if (svg){
    clone = svg.cloneNode(true);
    var vb = (clone.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    r = svg.getBoundingClientRect();
    LB.w = (vb.length === 4 && vb[2] > 0) ? vb[2] : (r.width || 900);
    LB.h = (vb.length === 4 && vb[3] > 0) ? vb[3] : (r.height || 600);
  } else {
    clone = img.cloneNode(true);
    clone.removeAttribute('loading');
    r = img.getBoundingClientRect();
    LB.w = img.naturalWidth || r.width || 900;
    LB.h = img.naturalHeight || r.height || 600;
  }
  clone.removeAttribute('style');
  clone.setAttribute('width', String(LB.w));
  clone.setAttribute('height', String(LB.h));
  canvas.style.width = LB.w + 'px';
  canvas.style.height = LB.h + 'px';
  canvas.innerHTML = '';
  canvas.appendChild(clone);
  var cap = box.querySelector('figcaption b');
  var label = box.getAttribute('data-dglabel') || (cap ? cap.textContent.trim() : '') ||
    (box.closest('section') && box.closest('section').querySelector('h2') ? box.closest('section').querySelector('h2').textContent.trim() : 'Diagram');
  n.querySelector('[data-lbtitle]').textContent = label;
  n.setAttribute('aria-label', label);

}
function lbClose(){
  if (!LBOX || LBOX.hidden) return;
  LBOX.hidden = true;
  LBOX.querySelector('[data-lbcanvas]').innerHTML = '';
  document.body.classList.remove('lbon');
  if (LB.opener && LB.opener.focus) LB.opener.focus();
  LB.opener = null;
}

function lbWire(n){
  var stage = n.querySelector('[data-lbstage]');
  n.addEventListener('click', function(e){
    var z = e.target.closest('[data-lbz]');
    if (z){ lbZoom(LB.k * (z.getAttribute('data-lbz') === '1' ? 1.3 : 1 / 1.3)); return; }
    if (e.target.closest('[data-lbfit]')){ lbFit(); return; }
    if (e.target.closest('[data-lbclose]') || e.target === stage){ lbClose(); }
  });
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    lbZoom(LB.k * Math.pow(0.999, e.deltaY), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  stage.addEventListener('dblclick', function(e){
    var r = stage.getBoundingClientRect();
    lbZoom(LB.k * 1.6, e.clientX - r.left, e.clientY - r.top);
  });
  stage.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    LB.drag = { x: e.clientX - LB.x, y: e.clientY - LB.y };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', function(e){
    if (!LB.drag) return;
    LB.x = e.clientX - LB.drag.x; LB.y = e.clientY - LB.drag.y; lbApply();
  });
  var end = function(e){
    if (!LB.drag) return;
    LB.drag = null;
    try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
    stage.classList.remove('dragging');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  window.addEventListener('resize', function(){ if (!n.hidden) lbFit(); });
}

// The whole frame opens it, not only the button — that is what a reader tries first.
document.addEventListener('click', function(e){
  if (e.target.closest('[data-lbclose],[data-lbz],[data-lbfit],.lbox')) return;
  // A gallery item whose title is a link opens the link; the picture opens the
  // viewer. Both are what a reader means by clicking each.
  if (e.target.closest('.galitem figcaption a')) return;
  var box = e.target.closest('.mermaid-box,.galitem');
  if (!box) return;
  if (lbMedia(box)) { lbOpen(box); return; }
  // Nothing to zoom — an interactive mockup is a page, so the frame opens it
  // rather than doing nothing, which is what a reader expects of a tile.
  var link = box.querySelector('figcaption a[href]');
  if (link) link.click();
});
document.addEventListener('keydown', function(e){
  if (!LBOX || LBOX.hidden) return;
  if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); lbClose(); return; }
  if (e.key === '+' || e.key === '='){ e.preventDefault(); lbZoom(LB.k * 1.3); }
  else if (e.key === '-' || e.key === '_'){ e.preventDefault(); lbZoom(LB.k / 1.3); }
  else if (e.key === '0'){ e.preventDefault(); lbFit(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); LB.x += 60; lbApply(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); LB.x -= 60; lbApply(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); LB.y += 60; lbApply(); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); LB.y -= 60; lbApply(); }
}, true);

/* ── chart config from a payload block ─────────────────── */
function chartConfig(b){
  var cs = getComputedStyle(document.documentElement), g = function(n, f){ return cs.getPropertyValue(n).trim() || f; };
  var palette = [g('--primary','#0D9488'), g('--accent','#84CC16'), g('--info','#38BDF8'), g('--danger','#FF4D4F'), g('--warn','#FACC15'), g('--text-muted','#909099')];
  var kind = b.chart, type = 'bar', opts = { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, padding:12 } } },
    scales:{ x:{ grid:{ display:false } }, y:{ grid:{ color:g('--border-light','#43434B') }, beginAtZero:true } } };
  if (kind === 'line' || kind === 'area') type = 'line';
  else if (kind === 'hbar'){ type = 'bar'; opts.indexAxis = 'y'; }
  else if (kind === 'stacked'){ type = 'line'; opts.scales.x.stacked = true; opts.scales.y.stacked = true; }
  else if (kind === 'radar'){ type = 'radar'; delete opts.scales; }
  else if (kind === 'doughnut'){ type = 'doughnut'; delete opts.scales; }
  if (b.stacked && type === 'bar'){ opts.scales.x.stacked = true; opts.scales.y.stacked = true; }

  var datasets = (b.datasets || []).map(function(ds, i){
    var c = ds.color || palette[i % palette.length];
    var base = { label: ds.label, data: ds.data, borderColor: c, backgroundColor: c, borderWidth: 1.5 };
    if (type === 'bar') base.borderRadius = 3;
    if (kind === 'line'){ base.tension = 0.3; base.fill = false; base.pointRadius = 2; base.backgroundColor = c; }
    if (kind === 'area'){ base.tension = 0.3; base.fill = true; base.pointRadius = 0; base.backgroundColor = c + '33'; }
    if (kind === 'stacked'){ base.tension = 0.3; base.fill = true; base.pointRadius = 0; base.backgroundColor = c + '55'; }
    if (kind === 'doughnut'){ base.backgroundColor = (b.labels || []).map(function(_, j){ return palette[j % palette.length]; }); base.borderWidth = 0; }
    if (kind === 'radar'){ base.backgroundColor = c + '33'; base.pointRadius = 2; }
    return base;
  });
  if (kind === 'doughnut') opts.cutout = '55%';
  return { type: type, data: { labels: b.labels || [], datasets: datasets }, options: opts };
}

        ? '<video data-video="' + id + '" controls preload="metadata" playsinline' +

      var is = mediaSrc(b.src);

        : '<div class="missing"><b>Image source refused</b>' + esc(b.alt) + '</div>';
    }
    return '<figure class="stage"><div class="screen">' + inner + '</div>' + bar +

      '<div class="alt">' + esc(b.alt) + '</div>' +
      (b.caption ? '<figcaption class="cap">' + inline(b.caption) + '</figcaption>' : '') + '</figure>';
  },
  audio: function(b){
    // A voice note, not a media player with a caption. The transcript ships in
    // the payload and renders in the page, so the clip is searchable, quotable
    // and readable by someone who cannot or will not play it — which is most
    // readers, most of the time.
    var id = stageId(b);

    var player = src
      ? '<audio data-video="' + id + '" controls preload="metadata"><source src="' + esc(src) + '">' +

    return '<figure class="stage voicenote">' +
      (b.title || meta.length

      beatList(id, b.chapters, 'video') +
      '<details class="vntx"><summary>Transcript</summary><div class="vnbody">' +
      inline(b.transcript) + '</div></details>' +
      (b.caption ? '<figcaption class="cap">' + inline(b.caption) + '</figcaption>' : '') +

  },
  demo: function(b){
    // The events live IN the payload, so the demo and the report cannot drift.
    var id = stageId(b);
    return '<figure class="stage"><div class="screen">' +
      '<div class="demoroot" data-demo="' + id + '" role="application" aria-label="' + esc(b.alt) + '"></div>' +
      '</div>' + beatList(id, b.steps, 'demo') +
      '<div class="alt">' + esc(b.alt) + '</div>' +

  docs: function(b){ return docList(b.docs || []); },

  /* ── the Product and Technical views ──────────────────────────────────
     Six blocks organised by INTENT rather than by source
     (docs/plans/2026-09-06-dashboard-product-technical-views.md). */
  // The product in one paragraph, its stage, then label/value rows.
  brief: function(b){
    return '<div class="brief">' +
      ((b.stage || b.title) ? '<div class="bhead">' + (b.title ? '<h3>' + esc(b.title) + '</h3>' : '') + (b.stage ? '<span class="badge stage' + tone(b.stageTone) + '">' + esc(b.stage) + '</span>' : '') + '</div>' : '') +
      (b.lede ? '<p class="blede">' + inline(b.lede) + '</p>' : '') +

      (b.links && b.links.length ? '<div class="blinks">' + (b.links || []).map(function(l){ return '<a href="' + esc(safeUrl(l.href)) + '">' + esc(l.label) + '</a>'; }).join('') + '</div>' : '') +

  // Health rows: a tone dot, the label, the value in mono, why it matters, a link.

  },
  // Scope: features grouped by state, shipped first, folded past twelve per group.
  features: function(b){

    return '<div class="features">' + ORDER.filter(function(k){ return groups[k]; }).map(function(k){
      var list = groups[k];
      return '<div class="fgroup"><div class="fghead"><span class="badge t-' + TONE[k] + '">' + LABEL[k] + '</span><span class="snum">' + list.length + '</span><span class="srule" aria-hidden="true"></span></div>' +
        list.map(function(f, i){
          return '<div class="frow"' + (list.length > FOLD + 2 && i >= FOLD ? ' data-folded="1" hidden' : '') + (f.id ? ' id="' + esc(f.id) + '"' : '') + '>' +
            '<span class="fn">' + esc(f.name) + '</span><span class="fa">' + esc(f.area || '') + '</span>' +
            '<span class="fnote">' + (f.note ? inline(f.note) : '') + (f.links && f.links.length ? ' <span class="flinks">' + f.links.map(function(l){ return '<a href="' + esc(safeUrl(l)) + '">' + esc(linkLabel(l)) + '</a>'; }).join('') + '</span>' : '') + '</span>' +

    }).join('') + '</div>' + (b.caption ? '<p class="cap">' + inline(b.caption) + '</p>' : '');
  },
  // Direction: ordered milestones, each with its gates.
  milestones: function(b){
    return '<div class="milestones">' + (b.items || []).map(function(m, i){
      return '<div class="ms' + tone(m.tone) + '"' + (m.id ? ' id="' + esc(m.id) + '"' : '') + '><div class="mh"><span class="mn">' + String(i + 1).padStart(2, '0') + '</span><h4>' + esc(m.title) + '</h4>' + (m.when ? '<span class="mw">' + esc(m.when) + '</span>' : '') + '</div>' +
        (m.body ? '<p class="mb">' + inline(m.body) + '</p>' : '') +
        (m.gates && m.gates.length ? '<div class="gates">' + (m.gates || []).map(function(g){
          var inner = '<span class="gg" aria-hidden="true"></span>' + esc(g.label);
          return g.href ? '<a class="gate g-' + esc(g.state) + '" href="' + esc(safeUrl(g.href)) + '">' + inner + '</a>' : '<span class="gate g-' + esc(g.state) + '">' + inner + '</span>';
        }).join('') + '</div>' : '') + '</div>';
    }).join('') + '</div>' + (b.caption ? '<p class="cap">' + inline(b.caption) + '</p>' : '');
  },
  // Activity per workstream per day: one lane per row, one cell per day,
  // intensity by count. The row label links to the workstream.
  swimlane: function(b){
    var days = b.days || [];
    var lanesN = (b.days || []).map(function(){ return 1; }).length;
    var max = 1; (b.rows || []).forEach(function(r){ r.counts.forEach(function(c){ if (c > max) max = c; }); });
    return '<div class="lanes" style="--n:' + days.length + '">' + (b.title ? '<h4>' + esc(b.title) + '</h4>' : '') +
      '<div class="lane lhead"><span class="ll"></span>' + days.map(function(d, i){ var lab = String(d).length > 5 ? String(d).slice(5) : String(d); return '<span class="ld">' + (i % 2 === 0 || days.length <= 8 ? esc(lab) : '') + '</span>'; }).join('') + '</div>' +
      (b.rows || []).map(function(r){
        var label = r.href ? '<a href="' + esc(safeUrl(r.href)) + '">' + esc(r.label) + '</a>' : esc(r.label);
        return '<div class="lane' + tone(r.tone) + '"><span class="ll">' + label + '</span>' + r.counts.map(function(c, i){
          return '<span class="lc" style="--i:' + (c ? (0.25 + 0.75 * c / max).toFixed(2) : 0) + '" title="' + esc(String(days[i])) + ': ' + c + ' event' + (c === 1 ? '' : 's') + '"></span>';
        }).join('') + '<span class="ln">' + r.counts.reduce(function(a, c){ return a + c; }, 0) + '</span></div>';
      }).join('') + '</div>' + (b.caption ? '<p class="cap">' + inline(b.caption) + '</p>' : '');
  },
  // The workstreams: a folding row each, three levels of disclosure.
  workstreams: function(b){
    var EV = { commit: 'commit', pr: 'github', run: 'play', session: 'sessions', ledger: 'ledger', evidence: 'evidence', doc: 'docs' };
    var STONE = { active: 'accent', blocked: 'danger', done: 'ok', stalled: 'warn', proposed: 'neutral' };
    var FOLD = 10;
    return '<div class="wsl">' + (b.items || []).map(function(w){
      var counts = w.counts || [], max = 1; counts.forEach(function(c){ if (c > max) max = c; });
      var spark = counts.length ? '<svg class="spark" viewBox="0 0 ' + (counts.length * 5) + ' 16" aria-label="activity by day" role="img">' + counts.map(function(c, i){
        var h = c ? Math.max(2, Math.round(14 * c / max)) : 1;
        return '<rect x="' + (i * 5) + '" y="' + (16 - h) + '" width="3.6" height="' + h + '" class="' + (c ? 'on' : 'off') + '"/>';
      }).join('') + '</svg>' : '';
      var total = counts.reduce(function(a, c){ return a + c; }, 0);
      var head = '<span class="badge ws-status t-' + (STONE[w.status] || 'neutral') + '">' + esc(w.status) + '</span>' +
        (w.kind === 'both' ? '<span class="badge">product + technical</span>' : '') +
        spark + '<span class="wsn">' + total + ' event' + (total === 1 ? '' : 's') + (w.lastActive ? ' · last ' + esc(w.lastActive) : '') + '</span>' +
        '<span class="srule" aria-hidden="true"></span>';
      var trio = (w.now || w.next || w.blocked) ? '<dl class="trio">' +
        (w.now ? '<div><dt>Now</dt><dd>' + inline(w.now) + '</dd></div>' : '') +
        (w.next ? '<div><dt>Next</dt><dd>' + inline(w.next) + '</dd></div>' : '') +
        (w.blocked ? '<div class="t-danger"><dt>Blocked on</dt><dd>' + inline(w.blocked) + '</dd></div>' : '') + '</dl>' : '';
      var decisions = (w.decisions && w.decisions.length) ? '<div class="wdec"><span class="wdl">Decisions in this thread</span>' + (w.decisions || []).map(function(d){
        return d.href ? '<a class="badge t-danger" href="' + esc(safeUrl(d.href)) + '">' + esc(d.title) + '</a>' : '<span class="badge t-danger">' + esc(d.title) + '</span>'; }).join('') + '</div>' : '';
      var evs = w.timelineEvents || [];
      var byDay = {}; var order = [];
      (w.timelineEvents || []).forEach(function(e){ var d = String(e.when).slice(0, 10); if (!byDay[d]){ byDay[d] = []; order.push(d); } byDay[d].push(e); });
      // Folded by DAY, so a collapsed timeline never shows an empty date row.
      var n = 0, fold = evs.length > FOLD + 2;
      var tl = evs.length ? '<div class="wtl">' + order.map(function(d){
        var startsAt = n;
        var inner = byDay[d].map(function(e){
          n++;
          var t = e.href ? '<a href="' + esc(safeUrl(e.href)) + '">' + esc(e.title) + '</a>' : esc(e.title);
          return '<div class="wev' + tone(e.tone) + '"><span class="wk" title="' + esc(e.kind) + '">' + icon(EV[e.kind] || 'info') + '</span>' + t + (e.ref ? '<span class="wref">' + esc(e.ref) + '</span>' : '') + '</div>';
        }).join('');
        return '<div class="wday"' + (fold && startsAt >= FOLD ? ' data-folded="1" hidden' : '') + '><span class="wd">' + esc(d) + '</span><div class="wevs">' + inner + '</div></div>';
      }).join('') + (fold ? '<button type="button" class="unfold" data-unfold="1" aria-expanded="false">' + icon('more') + 'Show all ' + evs.length + ' events</button>' : '') + '</div>' : '<p class="wempty">No activity matched this workstream in the window.</p>';
      var chips = (w.chips && w.chips.length) ? '<div class="wchips">' + (w.chips || []).map(function(c){
        var inner = icon(EV[c.kind] || 'link') + esc(c.label) + (c.count != null ? '<span class="n">' + esc(String(c.count)) + '</span>' : '');

      return foldSection({ id: 'ws-' + w.id, cls: 'ws ws-' + esc(w.status), title: w.title, open: w.open === true,
        head: head, teaser: (w.state ? '<p class="wstate">' + inline(w.state) + '</p>' : ''),
        body: (w.summary ? '<div class="prose wsum">' + md(w.summary) + '</div>' : '') + trio + decisions + tl + chips });
    }).join('') + '</div>' + (b.caption ? '<p class="cap">' + inline(b.caption) + '</p>' : '');
  }
};

function blocks(list){
  return (list || []).map(function(b){
    var fn = BLOCK[b && b.type];
    if (!fn) return '<div class="callout t-danger adt-render-error"><div class="ct">Unrenderable block</div><p>No renderer for block type ' +
      esc(b && b.type) + '. The payload validator should have refused this.</p></div>';
    return fn(b);
  }).join('\n');
}

/* ── folding sections ─────────────────────────────────────
   Progressive disclosure for a corpus: a section whose header is a toggle,
   its body hidden until asked for. Collapsed by default where the list is a
   wall (a docs group, an open decision), and the choice is remembered per
   page and section, so a reader who opened docs/plans finds it open next
   time. The outline rail expands a section before it scrolls to it, so a
   collapsed section is still one click away. */
var FOLD_KEY = 'adt:fold:' + (location.pathname || '');
function foldState(id, openDefault){
  try { var v = localStorage.getItem(FOLD_KEY + ':' + id); if (v === '1') return true; if (v === '0') return false; } catch (e) {}
  return !!openDefault;
}
function setFold(sec, open){
  if (!sec || !sec.classList.contains('fold')) return;
  sec.setAttribute('data-collapsed', open ? '0' : '1');
  var b = sec.querySelector(':scope > .shead [data-fold]'); if (b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
  var body = sec.querySelector(':scope > .sbody'); if (body) body.hidden = !open;
  try { localStorage.setItem(FOLD_KEY + ':' + sec.id, open ? '1' : '0'); } catch (e) {}
  // Anything this section was hiding is only now measurable — see renderMermaidIn.
  if (open && body) renderMermaidIn(body);
}
// head: the markup inside .shead after the toggle (count, rule, dates);
// teaser: always-visible markup between the head and the folded body.
function foldSection(o){
  var open = foldState(o.id, o.open);
  return '<section class="blk fold' + (o.cls ? ' ' + o.cls : '') + '" id="' + esc(o.id) + '" data-collapsed="' + (open ? '0' : '1') + '"><div class="shead">' +
    (o.icon ? '<span class="sicon">' + icon(o.icon) + '</span>' : '') +
    '<h2><button type="button" data-fold="1" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="' + esc(o.id) + '-body">' + icon('chev', 'chev') + esc(o.title) + '</button></h2>' +
    (o.head || '') + '</div>' + (o.teaser || '') +
    '<div class="sbody" id="' + esc(o.id) + '-body"' + (open ? '' : ' hidden') + '>' + o.body + '</div></section>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-fold]'); if (!b) return;
  var sec = b.closest('section.fold'); if (!sec) return;
  setFold(sec, sec.getAttribute('data-collapsed') === '1');
});

/* ── docs list + reader ────────────────────────────────── */
var DOCS = {};
/* Documents grouped by where they live — the root, then docs/decisions,
   docs/plans, design, runbooks, audits and so on — each group a section with
   its count and a compact row per document, so a corpus of hundreds reads as
   a shelf rather than a wall. Groups are folding sections, collapsed until
   opened, so the outline rail maps them and a group past twelve rows folds
   behind one further button. */
var DOC_GROUP_ORDER = ['root', 'docs/decisions', 'docs/adr', 'docs/plans', 'design', 'docs/runbooks', 'docs/audits', 'docs/reports', 'docs/mockups', 'docs/product', 'docs/evidence'];
function docGroupOf(path){
  var parts = String(path).split('/');
  if (parts.length === 1) return 'root';
  if (parts[0] === 'docs' && parts.length > 2) return 'docs/' + parts[1];
  return parts[0];
}
function docList(list){
  list.forEach(function(d){ DOCS[d.path] = d; });
  var groups = {};
  list.forEach(function(d){ var g = docGroupOf(d.path); (groups[g] = groups[g] || []).push(d); });
  var names = Object.keys(groups).sort(function(a, b){
    var ia = DOC_GROUP_ORDER.indexOf(a), ib = DOC_GROUP_ORDER.indexOf(b);
    if (ia === -1) ia = 99; if (ib === -1) ib = 99;
    return ia - ib || a.localeCompare(b);
  });
  var FOLD = 12;
  return names.map(function(g, gi){
    var docs = groups[g].slice().sort(function(a, b){ return String(b.path).localeCompare(String(a.path)); });
    var rows = docs.map(function(d, i){
      return '<div class="drow" data-doc="' + esc(d.path) + '"' + (docs.length > FOLD + 2 && i >= FOLD ? ' data-folded="1" hidden' : '') + '>' +
        '<span class="dt">' + esc(d.title) + '</span>' +
        (d.summary ? '<span class="ds">' + esc(d.summary) + '</span>' : '') +
        '<span class="dp">' + esc(d.path.replace(/^.*\//, '')) + '</span></div>';
    }).join('');
    var fold = docs.length > FOLD + 2 ? '<button type="button" class="unfold" data-unfold="1" aria-expanded="false">' + icon('more') + 'Show all ' + docs.length + ' documents</button>' : '';
    // Every group starts collapsed: the shelf reads as a list of directories
    // with counts, and a group opens on its header or from the outline rail.
    return foldSection({ id: 'docs-' + g.replace(/[^a-z0-9]+/gi, '-'), cls: 'dgroup-sec', icon: 'docs', title: g === 'root' ? 'Repository root' : g, open: false,
      head: '<span class="snum">' + docs.length + '</span><span class="srule" aria-hidden="true"></span>',
      body: '<div class="dgroup">' + rows + fold + '</div>' });
  }).join('');
}
function renderDoc(path){
  var d = DOCS[path];
  if (!d) return '<div class="callout t-danger adt-render-error"><p>Document not found: ' + esc(path) + '</p></div>';
  var body = md(d.md), toc = [];
  // md() deliberately offsets source headings by two levels so a document can
  // live below the report's own h1/h2 hierarchy. Index those rendered levels,
  // not the source levels: source h1/h2 become rendered h3/h4.
  body = body.replace(/<h([34])>(.*?)<\/h\1>/g, function(_, lv, txt){
    var id = 'h-' + toc.length;
    toc.push({ id:id, lv:lv, txt:txt.replace(/<[^>]+>/g, '') });
    return '<h' + lv + ' id="' + id + '">' + txt + '</h' + lv + '>';
  });
  return '<div class="crumb"><button data-back="1">← Back</button><span>' + esc(d.path) + '</span></div>' +
    '<div class="reader"><div class="toc">' + toc.map(function(t){
      return '<a href="#' + t.id + '" class="' + (t.lv === '4' ? 'h3' : '') + '">' + esc(t.txt) + '</a>';
    }).join('') + '</div><div class="prose">' + body + '</div></div>';
}

/* ── view renderers ────────────────────────────────────── */
var VIEW = {
  report: function(v){ return blocks(v.blocks); },
  // A deck is the same blocks in a different reading posture: one viewport per
  // slide, scroll-snapped, with chrome that tells the reader where they are.
  // Typography steps up because a deck is read from further away than a report.
  deck: function(v){
    var slides = v.slides || [];
    return '<div class="deck" data-deck="' + esc(v.id) + '">' +
      '<div class="dkbar"><div class="dkfill" data-dkfill="' + esc(v.id) + '"></div></div>' +
      '<div class="dkchrome">' +
        '<div class="dkdots">' + slides.map(function(sl, i){
          return '<button type="button" class="dkdot' + (i === 0 ? ' on' : '') + '" data-dkgo="' + esc(v.id) +
            '" data-i="' + i + '" aria-label="' + esc('Slide ' + (i + 1) + (sl.title ? ': ' + sl.title : '')) + '"></button>';
        }).join('') + '</div>' +
        '<span class="dkcount"><b data-dkat="' + esc(v.id) + '">1</b> / ' + slides.length + '</span>' +
      '</div>' +
      slides.map(function(sl, i){
        return '<section class="dkslide k-' + esc(sl.kind || 'content') + '" data-dki="' + i + '">' +
          '<div class="dkin">' +
            (sl.title ? '<h3 class="dkt">' + inline(sl.title) + '</h3>' : '') +
            (sl.note ? '<p class="dknote">' + inline(sl.note) + '</p>' : '') +
            blocks(sl.blocks) +
          '</div></section>';
      }).join('') + '</div>';
  },
  plan:   function(v){ return blocks(v.blocks); },
  // A docs or ledger view may carry blocks too (a dashboard opens every view
  // with a verdict); they render above the view's own content.
  docs:   function(v){ return (v.blocks ? blocks(v.blocks) : '') + docList(v.docs || []); },
  decisions: function(v){
    return (v.blocks ? blocks(v.blocks) : '') + (v.decisions || []).map(function(d, i){
      return '<div class="dec' + (d.contradicts ? ' contra' : '') + '"><div class="dh">' +
        '<span class="dn">' + String(i + 1).padStart(2, '0') + '</span><h4>' + esc(d.topic) + '</h4>' +
        (d.status ? '<span class="badge' + tone(d.tone) + '">' + esc(d.status) + '</span>' : '') + '</div>' +
        '<p class="db">' + inline(d.decision) + '</p>' +
        (d.why ? '<p class="db" style="color:var(--text-muted)">' + inline(d.why) + '</p>' : '') +
        (d.contradicts ? '<p class="contrab"><b>Contradiction resolved:</b> ' + inline(d.contradicts) + '</p>' : '') +
        '</div>';
    }).join('');
  },
  evidence: function(v){
    return (v.items || []).map(function(it){
      return '<div class="ev-item' + tone(it.tone) + '"><div class="eh"><h4>' + esc(it.claim) + '</h4></div>' +
        '<div class="ecmd">$ ' + esc(it.command) + '</div>' +
        '<div class="eout">' + esc(it.output) + '</div>' +
        '<div class="ev-v"><b>Verdict:</b> ' + inline(it.verdict) + '</div></div>';
    }).join('');
  },
  // The deferred-work ledger, read across every worktree of a repository
  // (tools/report/lib/ledger.mjs). Meters per region and per derived level,
  // then one card per entry with its branch state, so a deferral made on a
  // branch this morning is visible from the main dashboard and labelled.
  // Three modes. `decisions`: the open entries waiting on the user, each with
  // its question, options and consequences, recommendation and silence
  // default — the four parts rules/adt-core.md §0 requires of a decision handed
  // back. `work`: everything else, grouped by region and level as compact rows
  // with the long tail folded. `all` (default): the meters, filters and the
  // full entry cards, for a report that is only the ledger.
  ledger: function(v){
    var s = v.summary || {}, byR = s.byRegion || {}, byL = s.byLevel || {};
    var REGION = { decided: 'Decisions taken', unspecified: 'Not yet specified', 'out-of-scope': 'Out of scope' };
    var LEVEL = { decided: 'decided (an ADR resolves)', designed: 'designed (a plan resolves)', sharp: 'sharp (a runnable closing check)', fog: 'fog (nothing resolves yet)' };
    var LSHORT = { decided: 'decided', designed: 'designed', sharp: 'sharp', fog: 'fog' };
    var LTONE = { decided: 'ok', designed: 'info', sharp: 'accent', fog: 'warn' };
    var STATE = { main: 'ok', merged: 'neutral', live: 'info', stale: 'warn', detached: 'neutral' };
    var open = s.open || 0;
    var entries = (v.entries || []);
    var isDecision = function(e){ return e.status && e.status.state === 'open' && e.deferralReason === 'user-decision'; };
    var lead = v.blocks ? blocks(v.blocks) : '';
    var closing = function(e){ return e.closingCheck ? (e.closingCheck.command ? '`' + e.closingCheck.command + '`' : e.closingCheck.observation) : ''; };
    var scanned = '<p class="cap">Scanned ' + (v.scanned || []).length + ' worktree(s): ' + (v.scanned || []).map(function(w){
      return esc(w.branch || 'detached') + ' (' + esc(w.state) + (w.present ? ', ' + w.entries + ' entr' + (w.entries === 1 ? 'y' : 'ies') : ', no ledger') + ')';
    }).join(' · ') + '</p>';
    var invalid = (v.invalid || []).length ? '<div class="callout t-danger"><h4>' + (v.invalid.length) + ' invalid entr' + (v.invalid.length === 1 ? 'y' : 'ies') + ' — listed, not dropped</h4>' +
      v.invalid.map(function(i){ return '<p><code>' + esc(i.file) + '</code> — ' + esc(i.why) + '</p>'; }).join('') + '</div>' : '';

    if (v.mode === 'decisions'){
      var ds = entries.filter(isDecision);
      var body = ds.length ? ds.map(function(e, i){
        var d = e.decision;
        var opts = d ? '<ol class="dopts">' + d.options.map(function(o){
          return '<li><b>' + inline(o.label) + '</b> ' + inline(o.consequence) + '</li>'; }).join('') + '</ol>' : '';
        // The list of decisions is the top level: title, date and the
        // question. Options, recommendation, silence default and provenance
        // open on demand.
        return foldSection({ id: e.id, cls: 'decision', title: e.title, open: false,
          head: '<span class="snum">' + (i + 1) + '</span><span class="srule" aria-hidden="true"></span>' +
            '<span class="sd">' + esc(String(e.created).slice(0, 10)) + (e.onMain ? '' : ' · not on main') + '</span>',
          teaser: (d ? '<p class="dq">' + inline(d.question) + '</p>' : ''),
          body: (e.notes ? '<p class="dn">' + inline(e.notes) + '</p>' : '') +
            (d ? opts + '<p class="drec"><b>Recommendation</b> ' + inline(d.recommendation) + '</p><p class="dsil"><b>If nobody decides</b> ' + inline(d.silence) + '</p>'
               : '<p class="dmissing">Options not yet written — add a <code>decision</code> block (question, options, recommendation, silence) to <code>docs/ledger/' + esc(e.id) + '.json</code>.</p>') +
            '<div class="dmeta"><span>origin: ' + esc(e.origin.kind) + ' — ' + inline(e.origin.ref) + ' · ' + esc(e.established) + '</span>' +
            (closing(e) ? '<span>closes when: ' + inline(closing(e)) + '</span>' : '') +
            (e.links || []).map(function(l){ return '<span>' + inline('[' + l + '](' + l + ')') + '</span>'; }).join('') + '</div>' });
      }).join('') : '<div class="callout t-ok"><p>No open entry waits on a decision.</p></div>';
      return lead + body + invalid + scanned;
    }

    if (v.mode === 'work'){
      var rest = entries.filter(function(e){ return !isDecision(e); });
      var openRest = rest.filter(function(e){ return e.status && e.status.state === 'open'; });
      var closedRest = rest.filter(function(e){ return !(e.status && e.status.state === 'open'); });
      var meters = BLOCK.meters({ items: Object.keys(LEVEL).map(function(k){
        return { label: LEVEL[k], value: byL[k] || 0, max: open || 1, display: String(byL[k] || 0), tone: LTONE[k] };
      }), caption: 'Open entries by specification level — derived by the reader from what resolves, never declared' });
      var FOLD = 12;
      var row = function(e, i){
        return '<div class="wrow' + (e.onMain ? '' : ' offmain') + '"' + (i >= FOLD ? ' data-folded="1" hidden' : '') + '>' +
          '<span class="badge t-' + (LTONE[e.level] || 'neutral') + '">' + esc(LSHORT[e.level] || e.level) + '</span>' +
          '<span class="wt">' + esc(e.title) + '</span>' +
          '<span class="wm">' + esc(e.origin.kind) + ' · ' + inline(e.origin.ref) + (closing(e) ? ' · closes when ' + inline(closing(e)) : '') + (e.onMain ? '' : ' · <b>not on main</b>') + '</span></div>';
      };
      var group = function(title, list, id, openByDefault){
        if (!list.length) return '';
        var levels = ['fog', 'sharp', 'designed', 'decided'];
        var sorted = list.slice().sort(function(a, b){ return levels.indexOf(a.level) - levels.indexOf(b.level) || String(b.created).localeCompare(String(a.created)); });
        return '<section class="blk" id="' + esc(id) + '"><div class="shead"><h2>' + esc(title) + '</h2><span class="snum">' + list.length + '</span><span class="srule" aria-hidden="true"></span></div>' +
          '<details class="wgroup"' + (openByDefault ? ' open' : '') + '><summary>' + list.length + ' entr' + (list.length === 1 ? 'y' : 'ies') + '</summary><div class="wrows">' + sorted.map(row).join('') +
          (sorted.length > FOLD + 2 ? '<button type="button" class="unfold" data-unfold="1" aria-expanded="false">' + icon('more') + 'Show all ' + sorted.length + ' entries</button>' : '') +
          '</div></details></section>';
      };
      var byRegion = { unspecified: [], decided: [], 'out-of-scope': [] };
      openRest.forEach(function(e){ (byRegion[e.region] = byRegion[e.region] || []).push(e); });
      return lead + meters + invalid +
        group('Not yet specified — in scope, no sharp question yet', byRegion.unspecified, 'work-unspecified', true) +
        group('Decisions taken — one line each, the detail is linked', byRegion.decided, 'work-decided', false) +
        group('Out of scope', byRegion['out-of-scope'], 'work-out-of-scope', false) +
        group('Closed', closedRest, 'work-closed', false) + scanned;
    }

    var meters = BLOCK.meters({ items: Object.keys(REGION).map(function(k){
      return { label: REGION[k], value: byR[k] || 0, max: open || 1, display: String(byR[k] || 0), tone: k === 'unspecified' ? 'warn' : k === 'decided' ? 'ok' : 'neutral' };
    }), caption: 'Open entries by region' }) +
    BLOCK.meters({ items: Object.keys(LEVEL).map(function(k){
      return { label: LEVEL[k], value: byL[k] || 0, max: open || 1, display: String(byL[k] || 0), tone: LTONE[k] };
    }), caption: 'Open entries by specification level — derived by the reader from what resolves, never declared' });
    var filters = '<div class="lfilters" data-lfilters="' + esc(v.id) + '">' +
      ['open', 'closed', 'all'].map(function(f, i){ return '<button type="button" data-lf="' + f + '"' + (i === 0 ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + f + '</button>'; }).join('') +
      Object.keys(REGION).map(function(k){ return '<button type="button" data-lr="' + k + '" aria-pressed="false">' + esc(REGION[k]) + '</button>'; }).join('') +
      '</div>';
    var cards = entries.map(function(e){
      var closed = e.status && e.status.state === 'closed';
      var badges = [{ label: e.region, tone: e.region === 'unspecified' ? 'warn' : e.region === 'decided' ? 'ok' : 'neutral' }];
      if (e.level !== e.region) badges.push({ label: e.level, tone: LTONE[e.level] || null });
      if (e.deferralReason) badges.push({ label: 'deferred: ' + e.deferralReason, tone: 'neutral' });
      if (!e.onMain) badges.push({ label: 'not on main', tone: 'danger' });
      (e.branches || []).forEach(function(b){ if (b.branch && b.state !== 'main') badges.push({ label: b.branch + ' (' + b.state + ')', tone: STATE[b.state] || 'neutral' }); });
      if (closed) badges.push({ label: 'closed · ' + (e.status.closedBy || ''), tone: 'ok' });
      var rows = [];
      rows.push({ label: 'origin', value: e.origin.kind + ' — ' + e.origin.ref + ' · ' + e.established });
      if (closing(e)) rows.push({ label: 'closes when', value: closing(e) });
      (e.links || []).forEach(function(l){ rows.push({ label: 'link', value: '[' + l + '](' + l + ')' }); });
      if (e.notes) rows.push({ label: 'notes', value: e.notes });
      return '<div class="lentry" data-lstate="' + (closed ? 'closed' : 'open') + '" data-lregion="' + esc(e.region) + '">' +
        BLOCK.cards({ cards: [{ title: e.title, subtitle: e.id + ' · ' + String(e.created).slice(0, 10), badges: badges, rows: rows, tone: closed ? null : (e.onMain ? null : 'warn') }], columns: 1 }) +
        '</div>';
    }).join('');
    return lead + meters + invalid + filters + '<div class="lentries">' + (cards || '<div class="callout t-info"><p>No entries yet. <code>report ledger add</code> writes one.</p></div>') + '</div>' + scanned;
  },
  questionnaire: function(v){ return questionnaire(v); }
};

/* ── questionnaire ─────────────────────────────────────── */
/* The single answered-predicate. Every progress count, every card state and the
   exported payload must agree, or the page and the ingestion gate contradict
   each other in front of the user — measured 2026-08-19: one screen showed a
   green card, "0 answered" and "load-bearing 1/2" for the same question, and
   `report answers` then printed that answer verbatim and rejected it as
   unanswered. Choosing an option is an answer; so is writing what you would do
   instead. */
function isAnswered(a){
  if (!a) return false;
  if (a.choice) return true;
  return String(a.notes || a.other || '').trim().length > 0;
}

function stateFor(viewId){
  try { return JSON.parse(localStorage.getItem(SKEY + ':' + viewId) || '{}'); } catch (e) { return {}; }
}
function saveState(viewId, st){
  try { localStorage.setItem(SKEY + ':' + viewId, JSON.stringify(st)); } catch (e) {}
}
function questionnaire(v){
  var st = stateFor(v.id);
  var h = '';
  if (v.intro) h += blocks([v.intro]);
  h += '<div class="qprogress" data-prog="' + esc(v.id) + '">' +
    '<span class="pt"><b class="pdone">0</b> of <b>' + v.questions.length + '</b> answered</span>' +
    '<span class="ptrack"><span class="pfill" style="width:0%"></span></span>' +
    '<span class="pt plb"></span>' +
    '<button class="btn primary" data-copy="' + esc(v.id) + '">Copy responses</button>' +
    '<button class="btn ghost" data-clear="' + esc(v.id) + '">Reset</button>' +
    '</div>';

  h += '<div class="framing"><div class="ft">Is the framing wrong?</div>' +
    '<p>These questions assume a shape for the problem. If that shape is off, say so here — it is more useful than any answer below, ' +
    'and it is the one thing a form makes harder to tell me.</p>' +
    '<textarea rows="2" data-framing="' + esc(v.id) + '" placeholder="Leave blank if the framing is right.">' + esc(st.framingChallenge || '') + '</textarea></div>';

  h += v.questions.map(function(q){ return questionCard(v, q, st[q.id] || {}); }).join('');

  h += '<div class="qfoot">' +
    '<button class="btn primary" data-copy="' + esc(v.id) + '">Copy responses</button>' +
    '<span class="hint">Copies a JSON payload to your clipboard. Paste it back into the session with any message — ' +
    'the ingestion check reports how many questions it received and refuses to continue while a load-bearing one is unanswered.</span>' +
    '<div class="unanswered" data-unans="' + esc(v.id) + '"></div></div>';
  return h;
}
function questionCard(v, q, a){
  var answered = isAnswered(a);
  var h = '<div class="qcard' + (q.loadBearing ? ' lb' : '') + (answered ? ' answered' : '') + '" data-q="' + esc(q.id) + '" data-view="' + esc(v.id) + '">' +
    '<div class="qhead"><span class="qid">' + esc(q.id.toUpperCase()) + '</span><h3>' + esc(q.topic) + '</h3>' +
    (q.loadBearing ? '<span class="badge t-accent">load-bearing</span>' : '') + '</div>';
  if (q.context) h += '<div class="qctx">' + md(q.context) + '</div>';
  if (q.diagram) h += blocks([q.diagram]);

  h += (q.options || []).map(function(o){
    var sel = a.choice === o.key;
    var hasDetail = o.detail || (o.pros && o.pros.length) || (o.cons && o.cons.length);
    var meta = [];
    if (o.effort) meta.push('<span><b>Effort:</b> ' + esc(o.effort) + '</span>');
    if (o.risk) meta.push('<span><b>Risk:</b> ' + esc(o.risk) + '</span>');
    if (o.reuses && o.reuses.length) meta.push('<span><b>Reuses:</b> ' + esc(o.reuses.join(', ')) + '</span>');
    return '<div class="opt' + (sel ? ' sel' : '') + '">' +
      '<label class="ohead"><input type="radio" name="' + esc(q.id) + '" value="' + esc(o.key) + '"' + (sel ? ' checked' : '') + '>' +
      '<span class="obody"><span class="oline"><span class="okey">' + esc(o.key) + '.</span><span class="olabel">' + esc(o.label) + '</span>' +
      (q.recommendation === o.key ? '<span class="orec">recommended</span>' : '') + '</span>' +
      '<span class="osum">' + inline(o.summary) + '</span>' +
      (meta.length ? '<span class="ometa">' + meta.join('') + '</span>' : '') +
      '</span></label>' +
      (hasDetail ? '<button class="more" data-more="1">▸ why this, and what it costs</button>' +
        '<div class="odetail">' + (o.detail ? '<div class="prose">' + md(o.detail) + '</div>' : '') +
        ((o.pros && o.pros.length) || (o.cons && o.cons.length) ?
          '<div class="pc"><div class="pros"><div class="h">For</div><ul>' +
          (o.pros || []).map(function(p){ return '<li><span>' + inline(p) + '</span></li>'; }).join('') +
          '</ul></div><div class="cons"><div class="h">Against</div><ul>' +
          (o.cons || []).map(function(p){ return '<li><span>' + inline(p) + '</span></li>'; }).join('') +
          '</ul></div></div>' : '') + '</div>' : '') +
      '</div>';
  }).join('');

  if (q.allowOther !== false){
    var selOther = a.choice === 'OTHER';
    h += '<div class="opt' + (selOther ? ' sel' : '') + '">' +
      '<label class="ohead"><input type="radio" name="' + esc(q.id) + '" value="OTHER"' + (selOther ? ' checked' : '') + '>' +
      '<span class="obody"><span class="oline"><span class="okey">·</span><span class="olabel">Something else</span></span>' +
      '<span class="osum">Describe a different option. Use the box below.</span></span></label></div>';
  }

  h += '<div class="qfields">' +
    '<label>' + esc(q.notesPrompt || 'Your reasoning, caveats, or a different option') + '</label>' +
    '<textarea rows="2" data-notes="1" placeholder="Optional — but this is the part that makes the answer useful.">' + esc(a.other || a.notes || '') + '</textarea>' +
    '<div class="mis"><input type="checkbox" id="mis-' + esc(q.id) + '" data-mis="1"' + (a.misframed ? ' checked' : '') + '>' +
    '<label for="mis-' + esc(q.id) + '">This question is mis-framed — the real question is different</label></div>' +
    '<div class="miswhy' + (a.misframed ? ' on' : '') + '"><input type="text" data-miswhy="1" placeholder="What is the real question?" value="' + esc(a.misframedWhy || '') + '"></div>' +
    '</div></div>';
  return h;
}

function collect(v){
  var st = stateFor(v.id);
  var answers = v.questions.map(function(q){
    var a = st[q.id] || {};
    var choice = a.choice || null;
    var other = null, notes = a.notes || '';
    // Free text is the answer when it is the only thing given, and when the
    // reader explicitly picked "something else". Both export as `other`.
    if (choice === 'OTHER' || (!choice && notes.trim())){ other = notes.trim(); notes = ''; }
    return { questionId:q.id, choice:choice, other:other, notes:notes,
      misframed: !!a.misframed, misframedWhy: a.misframedWhy || '' };
  });
  var answeredN = answers.filter(function(a){ return a.choice || (a.other || '').trim(); }).length;
  var lb = v.questions.filter(function(q){ return q.loadBearing; });
  var lbAnswered = lb.filter(function(q){
    return isAnswered(st[q.id]); }).length;
  return {
    schema: 'adt.report.answers/1',
    reportId: META.id,
    viewId: v.id,
    round: v.round == null ? null : v.round,
    answeredAt: new Date().toISOString(),
    counts: { answered: answeredN, total: v.questions.length, loadBearingAnswered: lbAnswered, loadBearingTotal: lb.length },
    framingChallenge: st.framingChallenge || '',
    answers: answers
  };
}
function refreshProgress(v){
  var payload = collect(v);
  var root = document.getElementById('view-' + v.id);
  if (!root) return;
  var pct = v.questions.length ? (payload.counts.answered / v.questions.length) * 100 : 0;
  Array.prototype.forEach.call(root.querySelectorAll('[data-prog]'), function(p){
    p.querySelector('.pdone').textContent = payload.counts.answered;
    var fill = p.querySelector('.pfill');
    fill.style.width = pct.toFixed(1) + '%';
    fill.classList.toggle('done', payload.counts.answered === v.questions.length);
    var lbEl = p.querySelector('.plb');
    lbEl.innerHTML = payload.counts.loadBearingTotal
      ? 'load-bearing <b>' + payload.counts.loadBearingAnswered + '</b>/<b>' + payload.counts.loadBearingTotal + '</b>' : '';
  });
  var un = root.querySelector('[data-unans]');
  if (un){
    var st = stateFor(v.id);
    var missing = v.questions.filter(function(q){
      return q.loadBearing && !isAnswered(st[q.id]); });
    un.innerHTML = missing.length
      ? '<b>' + missing.length + ' load-bearing question' + (missing.length === 1 ? '' : 's') + ' unanswered:</b> ' +
        missing.map(function(q){ return esc(q.id.toUpperCase()) + ' ' + esc(q.topic); }).join(' · ') +
        ' — the session will refuse to build a plan until these are answered.'
      : '';
  }
  var nav = document.querySelector('[data-nav="' + v.id + '"] .dot');
  if (nav) nav.style.display = payload.counts.answered === v.questions.length ? 'none' : '';
}


/* Getting the answers out must never fail.
   `navigator.clipboard` needs a secure context, and a report opened as file://
   does not have one — measured 2026-08-19: the async API throws NotAllowedError
   there, which is the primary way these reports are opened. So this walks down:
   async API, then the legacy execCommand over a hidden textarea (which works in
   an insecure context), and finally — never silently — it puts the JSON on the
   page, selected, with an instruction. A person who has answered twelve
   questions must always be able to retrieve those answers. */
/* Picker interaction. Delegated, so it survives a view re-render — every other
   handler in this file works the same way and a picker is re-rendered whenever
   its view is re-entered.

   Selection persists under the same localStorage key as folds and answers,
   namespaced by the picker's own id so two pickers on one page do not collide.
   The persisted shape is a list of DROPPED ids rather than kept ones,
   deliberately: a picker's default is keep, so storing the exceptions means a
   picker that grows by ten items has those ten default to kept rather than
   silently appearing as dropped because they were absent from an older
   saved list. */
var PICKKEY = 'pick';

function pickState(pid){
  try { return JSON.parse(localStorage.getItem(SKEY + ':' + PICKKEY + ':' + pid) || '[]'); } catch (e) { return []; }
}
function pickSave(pid, dropped){
  try { localStorage.setItem(SKEY + ':' + PICKKEY + ':' + pid, JSON.stringify(dropped)); } catch (e) {}
}
function pickRoot(el){ return el.closest ? el.closest('[data-pick]') : null; }

function pickSync(root){
  if (!root) return;
  var pid = root.getAttribute('data-pick');
  var boxes = root.querySelectorAll('[data-pickitem]');
  var dropped = [];
  Array.prototype.forEach.call(boxes, function(b){ if (!b.checked) dropped.push(b.getAttribute('data-pickitem')); });
  pickSave(pid, dropped);

  var total = boxes.length, kept = total - dropped.length;
  var cnt = root.querySelector('[data-pickcount]');
  if (cnt) cnt.innerHTML = '<b>' + kept + '</b> of <b>' + total + '</b> kept';

  /* Per-group counts and the group checkbox's tri-state.

     The group box reports on what is VISIBLE, not on every item in the group,
     and that is deliberate rather than an oversight. Every bulk control here
     acts on the filtered set — "Keep all" under a filter means the rows you can
     see — so a group box reporting on hidden rows would be a control whose
     readout and whose effect have different denominators.

     Measured while driving this in a browser: with the box reporting on ALL
     items, filtering to one row of a two-row group and clicking the group box
     checked that row and then immediately redrew the box as indeterminate. The
     reader sees a checkbox bounce back and concludes the control is broken; it
     was accurately reporting a fact about rows that were not on screen.

     `indeterminate` is a property, not an attribute, so it can only be set
     here — never from the rendered HTML string. */
  Array.prototype.forEach.call(root.querySelectorAll('[data-pickgrp]'), function(g){
    var gi = g.getAttribute('data-pickgrp');
    var all = g.querySelectorAll('[data-pickitem]');
    var shown = Array.prototype.filter.call(all, function(b){
      return b.closest('.pickitem').style.display !== 'none'; });
    var scope = shown.length ? shown : Array.prototype.slice.call(all);
    var gk = 0;
    scope.forEach(function(b){ if (b.checked) gk++; });
    var gc = root.querySelector('[data-pickgcount="' + gi + '"]');
    // The count still names the full group when a filter is hiding part of it,
    // so the reader is never told a group is smaller than it is.
    if (gc) gc.textContent = shown.length && shown.length < all.length
      ? gk + '/' + scope.length + ' shown \u00b7 ' + all.length + ' total'
      : gk + '/' + all.length;
    var ga = root.querySelector('[data-pickgall="' + gi + '"]');
    if (ga){ ga.checked = gk === scope.length && scope.length > 0; ga.indeterminate = gk > 0 && gk < scope.length; }
  });
}

/* Restore on render. Runs after blocks are in the document, for every picker
   on the page, so a reader who selected yesterday sees their selection today. */
function pickRestore(scope){
  Array.prototype.forEach.call((scope || document).querySelectorAll('[data-pick]'), function(root){
    var dropped = pickState(root.getAttribute('data-pick'));
    if (dropped.length){
      var set = {};
      dropped.forEach(function(id){ set[id] = 1; });
      Array.prototype.forEach.call(root.querySelectorAll('[data-pickitem]'), function(b){
        if (set[b.getAttribute('data-pickitem')]) b.checked = false;
      });
    }
    pickSync(root);
  });
}

function pickFilter(root, q){
  var needle = (q || '').trim().toLowerCase();
  var shownTotal = 0;
  Array.prototype.forEach.call(root.querySelectorAll('.pickgrp'), function(g){
    var shown = 0;
    Array.prototype.forEach.call(g.querySelectorAll('.pickitem'), function(li){
      var hit = !needle || li.getAttribute('data-hay').indexOf(needle) >= 0;
      li.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    // A group with nothing matching disappears entirely rather than leaving a
    // header over an empty list, which reads as a group with no items.
    g.style.display = shown ? '' : 'none';
    shownTotal += shown;
  });
  // Group boxes report on the visible set, so the filter changing what is
  // visible changes what they must say.
  pickSync(root);
  var empty = root.querySelector('[data-pickempty]');
  if (!empty){
    empty = document.createElement('p');
    empty.className = 'pickempty';
    empty.setAttribute('data-pickempty', '1');
    root.appendChild(empty);
  }
  empty.textContent = (needle && shownTotal === 0) ? ('Nothing matches "' + q + '".') : '';
  empty.style.display = (needle && shownTotal === 0) ? '' : 'none';
}

function pickPayload(root){
  var pid = root.getAttribute('data-pick');
  var kept = [], dropped = [];
  Array.prototype.forEach.call(root.querySelectorAll('[data-pickitem]'), function(b){
    (b.checked ? kept : dropped).push(b.getAttribute('data-pickitem'));
  });
  return {
    schema: 'adt.report.picks/1',
    reportId: META.id,
    pickerId: pid,
    pickedAt: new Date().toISOString(),
    counts: { kept: kept.length, dropped: dropped.length, total: kept.length + dropped.length },
    kept: kept,
    dropped: dropped
  };
}

document.addEventListener('change', function(e){
  var t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  var root = pickRoot(t);
  if (!root) return;
  if (t.hasAttribute('data-pickgall')){
    var gi = t.getAttribute('data-pickgall');
    var grp = root.querySelector('[data-pickgrp="' + gi + '"]');
    if (grp) Array.prototype.forEach.call(grp.querySelectorAll('[data-pickitem]'), function(b){
      // Only touch what the filter is currently showing, so "select this group"
      // after a filter means what the reader can see rather than what is hidden.
      if (b.closest('.pickitem').style.display !== 'none') b.checked = t.checked;
    });
  }
  if (t.hasAttribute('data-pickitem') || t.hasAttribute('data-pickgall')) pickSync(root);
});

document.addEventListener('input', function(e){
  if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-pickfilter')){
    var root = pickRoot(e.target);
    if (root) pickFilter(root, e.target.value);
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  var root = pickRoot(b);
  if (!root) return;
  var visible = function(){
    return Array.prototype.filter.call(root.querySelectorAll('[data-pickitem]'), function(x){
      return x.closest('.pickitem').style.display !== 'none';
    });
  };
  if (b.hasAttribute('data-pickall')){ visible().forEach(function(x){ x.checked = true; }); pickSync(root); }
  else if (b.hasAttribute('data-picknone')){ visible().forEach(function(x){ x.checked = false; }); pickSync(root); }
  else if (b.hasAttribute('data-pickinv')){ visible().forEach(function(x){ x.checked = !x.checked; }); pickSync(root); }
  else if (b.hasAttribute('data-pickcopy')){
    var payload = pickPayload(root);
    copyOut(b, JSON.stringify(payload, null, 2), { answered: payload.counts.kept, total: payload.counts.total });
  }
});

function copyOut(btn, text, counts){
  var done = function(){
    var was = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', was);
    btn.textContent = counts ? ('Copied ' + counts.answered + '/' + counts.total) : 'Copied';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = was; btn.classList.remove('copied'); }, 2400);
  };
  var legacy = function(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var okc = false;
    try { okc = document.execCommand('copy'); } catch (e) { okc = false; }
    document.body.removeChild(ta);
    return okc;
  };
  var manual = function(){
    var box = document.getElementById('adt-manual-copy');
    if (!box){
      box = document.createElement('div');
      box.id = 'adt-manual-copy';
      box.className = 'callout t-warn';
      btn.parentNode.insertBefore(box, btn.nextSibling);
    }
    box.innerHTML = '<div class="ct">Your browser blocked the clipboard</div>' +
      '<p>A page opened as a local file has no secure context, so the copy button cannot reach the clipboard. ' +
      'Your answers are below and already selected — press ' +
      (navigator.platform.indexOf('Mac') === 0 ? '\u2318C' : 'Ctrl+C') + ' to copy them.</p>';
    var ta = document.createElement('textarea');
    ta.className = 'manual-copy';
    ta.value = text;
    ta.rows = 8;
    box.appendChild(ta);
    ta.focus(); ta.select();
    btn.textContent = counts ? 'Answers below \u2193' : 'Text below \u2193';
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){
      if (legacy()) done(); else manual();
    });
  } else if (legacy()) { done(); } else { manual(); }
}

/* ── the project selector ──────────────────────────────────
   Every project on this machine has a dashboard, and until now the only way
   between them was to remember a port. The dock's project name is a button:
   it opens the list, each row carrying when that dashboard was last
   regenerated, a star that pins it, two ways to open it, and its own
   regenerate prompt.

   The list comes from `meta.projects`, written into the payload at build time
   from the machine-level registry every dashboard build updates. It is
   embedded rather than fetched so the selector works from a file:// page,
   where there is nothing to fetch from. That means a row's date is as fresh as
   THIS page's last build, which is why every row states its own date rather
   than implying they are all current.

   The star is per-viewer and lives in localStorage: a pin is a preference, not
   a fact about the project, and it has no business in anyone else's page. */
var PROJ_FAV = 'adt:fav';
function favSet(){
  try { return new Set(JSON.parse(localStorage.getItem(PROJ_FAV) || '[]')); } catch (e) { return new Set(); }
}
function favToggle(name){
  var s = favSet();
  if (s.has(name)) s.delete(name); else s.add(name);
  try { localStorage.setItem(PROJ_FAV, JSON.stringify(Array.from(s))); } catch (e) {}
  return s;
}
/* Which address to use depends on where THIS page is open. A page served over
   http cannot navigate to file://, and a file:// page cannot reach a loopback
   server that is not running — so each row states the address it will use and
   the button carries it in its title, which is what makes a dead one
   diagnosable rather than merely broken. */
function projHref(p){
  if (location.protocol === 'file:') return p.file || p.url || '';
  return p.url || p.file || '';
}
function projAge(iso){
  if (!iso) return { text: 'never recorded', tone: 'warn' };
  var h = (Date.now() - Date.parse(iso)) / 3600000;
  if (!isFinite(h)) return { text: String(iso).slice(0, 10), tone: '' };
  if (h < 1) return { text: 'just now', tone: 'ok' };
  if (h < 24) return { text: Math.round(h) + 'h ago', tone: 'ok' };
  var d = Math.round(h / 24);
  return { text: d + (d === 1 ? ' day ago' : ' days ago'), tone: d > 7 ? 'warn' : '' };
}
function projRow(p, fav, here){
  var age = projAge(p.generated);
  var isHere = p.name === here;
  var href = projHref(p);
  var starred = fav.has(p.name);
  var acts = p.generated
    ? (p.prompt ? '<button type="button" class="projbtn" data-projprompt="' + esc(p.name) + '" title="Copy the prompt that regenerates ' + esc(p.name) + '">' + icon('regen') + '</button>' : '') +
      '<button type="button" class="projbtn" data-projopen="' + esc(href) + '" title="Open ' + esc(p.name) + ' here — ' + esc(href || 'no address recorded') + '"' + (href ? '' : ' disabled') + '>' + icon('enter') + '</button>' +
      '<button type="button" class="projbtn" data-projtab="' + esc(href) + '" title="Open ' + esc(p.name) + ' in a new tab — ' + esc(href || 'no address recorded') + '"' + (href ? '' : ' disabled') + '>' + icon('newtab') + '</button>'
    // A repository with no dashboard has nothing to open. What it CAN offer is
    // the prompt that makes one, which is the only useful action on that row.
    : '<button type="button" class="projbtn" data-projmake="' + esc(p.path || p.name) + '" title="Copy a prompt that builds a dashboard for ' + esc(p.name) + '">' + icon('regen') + '</button>';
  return '<div class="projrow' + (isHere ? ' here' : '') + (p.generated ? '' : ' none') + '" data-projname="' + esc(p.name) + '">' +
    '<button type="button" class="projstar" data-projfav="' + esc(p.name) + '" aria-pressed="' + (starred ? 'true' : 'false') +
      '" title="' + (starred ? 'Unpin ' : 'Pin ') + esc(p.name) + ' to the top">' + icon('star') + '</button>' +
    '<span class="projname">' + esc(p.name) + (isHere ? '<em>you are here</em>' : '') + '</span>' +
    '<span class="projwhen t-' + age.tone + '" title="' + esc(p.generated || ('no dashboard; last commit ' + (p.lastCommit || 'unknown'))) + '">' + esc(age.text) + '</span>' +
    '<span class="projacts">' + acts + '</span></div>';
}
function projRows(){
  var list = (META.projects || []).slice();
  var fav = favSet();
  var here = META.brand || META.title;
  if (!list.length) {
    return '<p class="projempty">No repository registry on this machine yet. <code>report repos --scan</code> builds it, and every dashboard build refreshes it.</p>';
  }
  var have = list.filter(function(p){ return p.generated; });
  var none = list.filter(function(p){ return !p.generated; });
  var byFav = function(a, b){
    var fa = fav.has(a.name) ? 0 : 1, fb = fav.has(b.name) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return String(a.name).localeCompare(String(b.name));
  };
  have.sort(byFav);
  // Without a dashboard the useful ordering is recency: a repository last
  // touched in 2021 is not one anybody is about to open.
  none.sort(function(a, b){
    var fa = fav.has(a.name) ? 0 : 1, fb = fav.has(b.name) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return String(b.lastCommit || '').localeCompare(String(a.lastCommit || ''));
  });
  var SHOW = 6;
  var out = have.map(function(p){ return projRow(p, fav, here); }).join('');
  if (!have.length) out = '<p class="projempty">No repository on this machine has a dashboard yet.</p>';
  if (none.length){
    var shown = none.slice(0, SHOW), rest = none.length - shown.length;
    out += '<div class="projsplit">' + none.length + ' with source and no dashboard</div>' +
      shown.map(function(p){ return projRow(p, fav, here); }).join('') +
      (rest > 0 ? '<p class="projfoot">and ' + rest + ' more, least recently committed. <code>report repos</code> lists them all.</p>' : '');
  }
  return out;
}
function projPanel(open){
  var p = document.getElementById('adt-proj');
  var b = document.getElementById('adt-brand');
  if (!p || !b) return;
  if (open) p.innerHTML = '<div class="projhead">Dashboards on this machine<span>' + ((META.projects || []).length) + '</span></div>' + projRows() +
    '<p class="projfoot">Dates are as of this page&rsquo;s last build. A star pins a project for you only.</p>';
  p.hidden = !open;
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  var b = e.target.closest('#adt-brand');
  if (b){ projPanel(document.getElementById('adt-proj').hidden); return; }
  var fav = e.target.closest('[data-projfav]');
  if (fav){ favToggle(fav.getAttribute('data-projfav')); projPanel(true); return; }
  var pr = e.target.closest('[data-projprompt]');
  if (pr){
    var name = pr.getAttribute('data-projprompt');
    var proj = (META.projects || []).filter(function(x){ return x.name === name; })[0];
    if (proj && proj.prompt) copyOut(pr, proj.prompt);
    return;
  }
  var mk = e.target.closest('[data-projmake]');
  if (mk){
    var mpath = mk.getAttribute('data-projmake');
    copyOut(mk, 'Build the repository dashboard for ' + mpath + ' with Skill("repo-dashboard"). Run its build script first (node ~/.claude/skills/repo-dashboard/scripts/build.mjs --repo ' + mpath + '), read the coverage it prints in full, author docs/dashboard/product.json and workstreams.json, write the verdict every tab opens with from the git log, PRs, sessions and ledger, validate with report validate, open it in a browser, and commit only what changed.');
    return;
  }
  var op = e.target.closest('[data-projopen]');
  if (op){ var h = op.getAttribute('data-projopen'); if (h) location.href = h; return; }
  var nt = e.target.closest('[data-projtab]');
  if (nt){ var h2 = nt.getAttribute('data-projtab'); if (h2) window.open(h2, '_blank', 'noopener'); return; }
  // A click anywhere else closes it, which is what a reader expects of a
  // popover and what stops it sitting open behind the page.
  if (!e.target.closest('#adt-proj')) projPanel(false);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ var p = document.getElementById('adt-proj'); if (p && !p.hidden) { e.preventDefault(); projPanel(false); } }
});

/* ── render + route ────────────────────────────────────── */
function renderMasthead(){
  var m = document.getElementById('adt-masthead');
  // A repo dashboard carries `meta.dashboard` (generatedAt, head, branch,
  // staleAfterHours) and a regeneration prompt. Its age is computed HERE, at
  // open time, because a committed page is only as fresh as its last
  // regeneration and three weeks later it would otherwise read as current.
  var dash = META.dashboard || null;
  var stale = '';
  if (dash && dash.generatedAt){
    var ageH = (Date.now() - Date.parse(dash.generatedAt)) / 3600000;
    var limit = dash.staleAfterHours || 48;
    if (ageH > limit){
      var ageTxt = ageH < 48 ? Math.round(ageH) + ' hours' : Math.round(ageH / 24) + ' days';
      stale = '<div class="stale" role="status">Generated ' + esc(ageTxt) + ' ago at ' + esc(String(dash.head || '').slice(0, 7)) + (dash.branch ? ' on ' + esc(dash.branch) : '') + ' — the numbers here are that old. ' +
        (META.prompt ? '<button type="button" class="btn regen" data-regen>Copy the regenerate prompt</button>' : '') + '</div>';
    }
  }
  var regen = META.prompt && META.kind === 'dashboard' && !stale ? '<button type="button" class="btn regen" data-regen>Copy the regenerate prompt</button>' : '';
  m.innerHTML = '<div class="label">' + esc(META.label || (META.kind === 'session' ? 'Session Dashboard' : META.kind === 'dashboard' ? 'Repo Dashboard' : 'Report')) + '</div>' +
    '<h1 class="mast">' + inline(META.title) + '</h1>' +
    (META.subtitle ? '<p class="mast-sub">' + inline(META.subtitle) + '</p>' : '') +
    stale +
    '<div class="meta">' +
    (META.created ? '<span>created ' + esc(String(META.created).slice(0, 16).replace('T', ' ')) + '</span>' : '') +
    (META.updated ? '<span>updated ' + esc(String(META.updated).slice(0, 16).replace('T', ' ')) + '</span>' : '') +
    '<span>' + VIEWS.length + ' view' + (VIEWS.length === 1 ? '' : 's') + '</span>' +
    (META.repo ? '<span>' + esc(META.repo) + '</span>' : '') +
    (regen ? '<span class="meta-regen">' + regen + '</span>' : '') +
    '</div>';
  Array.prototype.forEach.call(m.querySelectorAll('[data-regen]'), function(b){
    b.addEventListener('click', function(){ copyOut(b, META.prompt, null); });
  });
  // The project name is a button when there is somewhere to go, and plain text
  // when there is not — a control that does nothing is worse than no control.
  var brandEl = document.getElementById('adt-brand');
  var label = esc(META.brand || META.title) + (META.kind === 'session' ? ' <span>/ session</span>' : '');
  if ((META.projects || []).length){
    brandEl.classList.add('picker');
    brandEl.setAttribute('role', 'button');
    brandEl.setAttribute('tabindex', '0');
    brandEl.setAttribute('aria-expanded', 'false');
    brandEl.setAttribute('aria-controls', 'adt-proj');
    brandEl.setAttribute('aria-label', 'Switch project — ' + (META.projects || []).length + ' dashboards on this machine');
    brandEl.innerHTML = label + icon('more', 'brandchev');
  } else {
    brandEl.innerHTML = label;
  }
  document.getElementById('adt-q').placeholder = 'search this report  ( / )';
}
function renderNav(){
