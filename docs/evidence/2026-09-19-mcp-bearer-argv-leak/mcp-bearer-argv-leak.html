<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP bearer token leaked into argv</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
--bg:#17171A;--surface:#202024;--surface-raised:#282830;--surface-active:#303038;
--border:#333339;--border-light:#43434B;
--text:#ECECF0;--text-secondary:#A4A4AE;--text-muted:#909099;
--primary:#0D9488;--primary-subtle:#042F2E;--accent:#84CC16;--accent-text:#A3E635;--accent-subtle:#1A2E05;
--success:#4ADE80;--success-subtle:#042010;--danger:#FF4D4F;--danger-subtle:#1A0505;--info:#38BDF8;--info-subtle:#082F49;
--warn:#FACC15;--warn-subtle:#1A1700;
--font-display:'Syne',system-ui,sans-serif;--font-sans:'DM Sans',system-ui,sans-serif;--font-mono:'Inconsolata',ui-monospace,monospace;
--radius:3px}
/* ── the surface language ─────────────────────────────────────────────────
   Structure, not palette. The palette above is replaced per project by
   `deriveTheme`; what follows is how a page is COMPOSED and is the same for
   every project, because the language it encodes is the one a working
   surface is built from (business-os-cloud design/surface-language.md):

     · one frame — the margin grows with the viewport, the content does not
     · surfaces blend into the canvas: whitespace first, then a shared
       background, then a single hairline — never a box as the default
     · one voice per role: display face for headings, sans for reading,
       mono for numbers, code and column heads only
     · a recess, not a lift, for anything interactive or inset

   Every value here is derived from the palette or from these few structural
   tokens, so a project's theme replaces the colours and keeps the shape. */
:root{
--radius-card:6px;--radius-control:4px;--radius-floating:12px;
--leading-display:1.25;--leading-body:1.6;
--measure-page:1440px;--measure-prose:76ch;
--hair:var(--border);--hair-strong:var(--border-light);
--well:color-mix(in srgb,var(--bg) 62%,#000);
--wash:color-mix(in srgb,var(--surface) 55%,transparent);
--ease-out:cubic-bezier(.2,0,0,1);--dur:180ms}
html{font-size:14px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none;border-bottom:1px solid transparent;transition:color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)}
a:hover{color:var(--accent-text);border-bottom-color:currentColor}
::selection{background:var(--primary-subtle);color:var(--accent-text)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* Numbers, code and column heads are the only mono voices. */
.num,.data,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.overline{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:500}

/* ── chrome: the dock ───────────────────────────────────────
   One floating bar, bottom-centre, carrying the brand mark, a button per view
   and search. Content above it takes the full width; the bar never scrolls
   away. Results and menus open UPWARD because the bar sits at the bottom.
   It FLOATS, so it takes the floating radius — the one surface on the page
   that is allowed a shadow, because it genuinely sits above the canvas. */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;
  max-width:92vw;padding:6px 8px 6px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border:1px solid var(--hair);border-radius:var(--radius-floating);box-shadow:0 18px 44px -14px rgba(0,0,0,.8)}
.brand{font-family:var(--font-display);font-weight:700;font-size:13px;white-space:nowrap;padding-right:12px;border-right:1px solid var(--hair)}
.brand span{color:var(--primary);font-weight:500}
.dock .nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:62vw}
.dock .nav::-webkit-scrollbar{display:none}
.dock .nav button{font-family:var(--font-sans);font-size:12.5px;font-weight:500;padding:6px 12px;background:transparent;color:var(--text-muted);border:0;cursor:pointer;border-radius:999px;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center;gap:7px;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.dock .nav button .ic{width:14px;height:14px;opacity:.7}
.dock .nav button[aria-current="page"] .ic{opacity:1}
.dock .nav button:hover,.dock .nav button:focus-visible{color:var(--text);background:var(--well)}
.dock .nav button[aria-current="page"]{background:var(--well);color:var(--primary)}
.dock .nav button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
/* The project name in the dock is the switcher. It reads as a control on
   hover and opens a popover anchored to it, not a modal: switching projects is
   a navigation, and a navigation should not take the screen. */
.brand.picker{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:var(--radius-control);
  padding-right:10px;transition:color var(--dur) var(--ease-out)}
.brand.picker:hover,.brand.picker:focus-visible{color:var(--primary)}
.brand.picker:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.brand .brandchev{width:11px;height:11px;opacity:.55;flex:none}
.brand.picker[aria-expanded="true"] .brandchev{transform:rotate(180deg)}

.projpanel{position:absolute;left:8px;bottom:52px;width:min(440px,92vw);max-height:min(60vh,520px);overflow:auto;
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(14px);
  border:1px solid var(--hair);border-radius:var(--radius-floating);box-shadow:0 14px 44px rgba(0,0,0,.6);
  padding:8px;z-index:75;animation:rise .16s var(--ease-out)}
.projhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 8px 10px;
  font:600 10.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.projhead span{font-weight:400;opacity:.7}
.projrow{display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:8px;
  padding:6px 6px;border-radius:var(--radius-control);transition:background var(--dur) var(--ease-out)}
.projrow:hover{background:var(--well)}
.projrow.here{background:var(--primary-subtle)}
.projname{font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projname em{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--primary);margin-left:8px}
.projwhen{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);white-space:nowrap}
.projwhen.t-ok{color:var(--success)}
.projwhen.t-warn{color:var(--warn)}
.projacts{display:flex;gap:2px}
.projstar,.projbtn{all:unset;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:var(--radius-control);color:var(--text-muted);cursor:pointer;
  transition:color var(--dur) var(--ease-out),background var(--dur) var(--ease-out)}
.projstar .ic,.projbtn .ic{width:13px;height:13px}
.projstar:hover,.projbtn:hover{color:var(--text);background:var(--surface-active)}
.projstar:focus-visible,.projbtn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
/* A pinned project reads as pinned at a glance: the star fills. */
.projstar[aria-pressed="true"]{color:var(--warn)}
.projstar[aria-pressed="true"] .ic{fill:currentColor}
.projbtn[disabled]{opacity:.3;cursor:not-allowed}
.projempty,.projfoot{margin:0;padding:10px 8px 4px;font-size:11px;line-height:1.5;color:var(--text-muted)}
.projfoot{border-top:1px solid var(--hair);margin-top:6px;padding-top:8px}
@media (max-width:560px){.projpanel{left:4px;width:calc(100vw - 16px)}}

.search{position:relative}
.search input{font-family:var(--font-sans);font-size:12.5px;background:var(--well);border:1px solid transparent;color:var(--text);padding:7px 12px;border-radius:999px;width:150px;outline:none;transition:width var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)}
.search input::placeholder{color:var(--text-muted)}
.search input:focus{border-color:var(--primary);width:260px}
.results{position:absolute;right:0;bottom:46px;width:min(560px,86vw);max-height:60vh;overflow:auto;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:var(--radius-floating);display:none;z-index:70;box-shadow:0 14px 44px rgba(0,0,0,.6)}
.results.on{display:block;animation:rise .16s var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rItem{padding:10px 14px;border-bottom:1px solid var(--hair);cursor:pointer}
.rItem:last-child{border-bottom:0}
.rItem:hover{background:var(--well)}
.rItem b{color:var(--primary);font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px;font-weight:500}
.rItem p{margin:0;font-size:12.5px;color:var(--text-secondary);line-height:1.5}
.rItem mark{background:var(--accent-subtle);color:var(--accent-text);padding:0 2px}

/* ── chrome: the outline rail ───────────────────────────────
   The current view's sections, as a column of ticks in the left margin. It
   never pushes content: it lives in the frame's own margin, which is why the
   frame keeps a floor of side padding at the widths the rail shows at.
   Position comes from the scroll, so the tick that is lit is the section on
   screen.

   At rest it used to be ticks alone, and it read as decoration: measured on
   the garden-birbs Product tab, a reader looking for a table of contents did
   not find one that was rendered and visible. So it now carries a standing
   label, and where the margin is genuinely wide (1500px and up) it shows its
   section titles without being hovered — an outline nobody can see is an
   outline nobody uses. */
.outline{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:2px;
  padding:8px 6px;border-radius:var(--radius-floating);border:1px solid transparent;
  transition:background var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out),padding var(--dur) var(--ease-out)}
.outline[hidden]{display:none}
.outline:hover,.outline:focus-within,.outline.pinned{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-color:var(--hair);padding:10px 14px 10px 8px;box-shadow:0 18px 44px -14px rgba(0,0,0,.8)}
/* The standing label. It is always readable, so the rail announces what it is
   before anyone hovers it. */
.outline .oh{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-muted);padding:2px 6px 8px;white-space:nowrap;
  transition:color var(--dur) var(--ease-out)}
.outline .oh .ic{width:12px;height:12px;flex:none;opacity:.8}
.outline .oh .ohl{max-width:0;opacity:0;overflow:hidden;transition:max-width var(--dur) var(--ease-out),opacity var(--dur) var(--ease-out)}
.outline:hover .oh,.outline:focus-within .oh,.outline.pinned .oh{color:var(--text-secondary)}
.outline:hover .ohl,.outline:focus-within .ohl,.outline.pinned .ohl{max-width:160px;opacity:1}
.outline button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:5px 6px;cursor:pointer;color:var(--text-muted);min-height:26px;border-radius:var(--radius-control);text-align:left;font:inherit;transition:color var(--dur) var(--ease-out),background var(--dur) var(--ease-out)}
/* The tick grows by transform, not width: it is the one thing here that
   animates on every scroll. */
.outline button .tick{width:22px;height:2px;flex:none;background:var(--hair-strong);border-radius:1px;transform:scaleX(.64);transform-origin:left center;transition:transform var(--dur) var(--ease-out),background var(--dur) var(--ease-out)}
.outline button.d2 .tick{transform:scaleX(.36);margin-left:6px}
.outline button[aria-current="true"] .tick{background:var(--primary);transform:none}
.outline button.d2[aria-current="true"] .tick{transform:scaleX(.64)}
.outline button .ol{font-family:var(--font-sans);font-size:12.5px;white-space:nowrap;max-width:0;opacity:0;overflow:hidden;transform:translateX(-6px);transition:opacity var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.outline button .ol .n{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:8px}
.outline:hover .ol,.outline:focus-within .ol,.outline.pinned .ol{max-width:260px;opacity:1;transform:none}
.outline button:hover,.outline button:focus-visible{color:var(--text);background:var(--well)}
.outline button[aria-current="true"]{color:var(--text)}
.outline button[aria-current="true"] .ol{color:var(--primary)}
/* Wide enough that the margin can hold the titles: show them. Below this the
   rail stays a handle that expands on hover, and below 1100 it is gone,
   because there is no margin left to live in. */
/* The selectors here MATCH the base rules they override. `.outline .ol` is
   less specific than `.outline button .ol` and loses, silently — measured by
   injecting this block at a width that matched and watching opacity stay 0. */
@media (min-width:1500px){
  .outline{background:color-mix(in srgb,var(--surface) 72%,transparent);border-color:var(--hair);padding:10px 14px 10px 8px}
  .outline button .ol{max-width:220px;opacity:1;transform:none}
  .outline .oh{color:var(--text-secondary)}
  .outline .oh .ohl{max-width:160px;opacity:1}
}
@media (max-width:1100px){.outline{display:none}}

/* ── panels ─────────────────────────────────────────────────
   A pane on the left (files) or the right (dev-server logs) squeezes the
   frame rather than covering it — the frame's side padding grows by the pane's
   width. Width and padding animate, the one sanctioned exception to
   transform-only motion, because a transform cannot reflow the content and
   the reflow is the effect. A pane is a hairline on the side facing the
   content and nothing else: no box, no shadow, the same canvas. */
:root{--pane-l:300px;--pane-r:440px}
.pane{position:fixed;top:0;bottom:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;font-size:13px}
.pane[hidden]{display:none}
.pane-l{left:0;width:var(--pane-l);border-right:1px solid var(--hair)}
.pane-r{right:0;width:var(--pane-r);border-left:1px solid var(--hair)}
.pane .ph{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--hair);flex:none}
.pane .pt{font-family:var(--font-display);font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane .pm{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
.pane select{font-family:var(--font-sans);font-size:12px;background:var(--well);color:var(--text);border:1px solid transparent;border-radius:var(--radius-control);padding:5px 8px;max-width:180px;outline:none}
.pane select:focus{border-color:var(--primary)}
.pane .pclose{background:none;border:0;color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:999px;min-width:32px;min-height:32px}
.pane .pclose:hover{background:var(--well);color:var(--text)}
.pane .pbody{flex:1;overflow:auto;padding:8px 8px 90px}
.pane .plog{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text-secondary);padding:10px 14px 90px}
.plog .ll.err{color:var(--warn)}.plog .ll.sys{color:var(--text-muted)}
.pnote{font-size:12.5px;color:var(--text-secondary);padding:10px 12px;line-height:1.55;max-width:60ch}
.pnote.t-danger{color:var(--danger)}
.pnote code{font-family:var(--font-mono);background:var(--well);padding:1px 5px;border-radius:2px;color:var(--accent-text)}
.tload{padding:8px 12px;color:var(--text-muted)}
body.with-pane-l .wrap{padding-left:calc(var(--pane-l) + 28px)}
body.with-pane-r .wrap{padding-right:calc(var(--pane-r) + 28px)}
body.with-pane-l .outline{display:none}
.wrap{transition:padding var(--dur) var(--ease-out)}
/* the tree */
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:14px}
.tree .tn{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;color:var(--text-secondary);font:inherit;font-size:12.5px;padding:4px 6px;border-radius:var(--radius-control);cursor:pointer;text-align:left;min-height:28px}
.tree .tn:hover,.tree .tn:focus-visible{background:var(--well);color:var(--text)}
.tree .tn .ic{width:14px;height:14px;color:var(--text-muted);flex:none}
.tree .tn .tc{width:10px;height:10px;transition:transform var(--dur) var(--ease-out)}
.tree .tdir.open > .tn .tc{transform:rotate(90deg)}
.tree .tdir > .tn{color:var(--text)}
.tree .tn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .tn em{font-family:var(--font-mono);font-style:normal;font-size:10.5px;color:var(--text-muted)}
/* the dock's tools and the dev menu */
.dock .tools{display:flex;gap:2px;position:relative;padding-right:8px;border-right:1px solid var(--hair)}
.dock .tools button{font-family:var(--font-sans);font-size:12.5px;font-weight:500;padding:6px 10px;background:transparent;color:var(--text-muted);border:0;cursor:pointer;border-radius:999px;min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.dock .tools button .ic{width:14px;height:14px;opacity:.75}
.dock .tools button:hover,.dock .tools button:focus-visible,.dock .tools button[aria-pressed="true"],.dock .tools button[aria-expanded="true"]{color:var(--primary);background:var(--well)}
.devmenu{position:absolute;left:0;bottom:46px;width:min(640px,88vw);max-height:64vh;overflow:auto;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:var(--radius-floating);box-shadow:0 14px 44px rgba(0,0,0,.6);padding:10px 12px 12px;animation:rise .16s var(--ease-out);z-index:70}
.devmenu[hidden]{display:none}
.devmenu .dh2{font-family:var(--font-display);font-weight:600;font-size:13px;padding:6px 4px 8px;display:flex;gap:10px;align-items:baseline}
.devmenu .dh2 .dsub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);font-weight:400}
.devmenu .drow2{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--hair);font-size:12.5px}
.devmenu .drow2 .dn2{font-weight:500;color:var(--text);min-width:80px}
.devmenu .dport{font-family:var(--font-mono);font-size:11.5px;min-width:52px}
.devmenu .dst{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);flex:1}
.devmenu .dcode{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devmenu input[type=number]{width:74px;font-family:var(--font-mono);font-size:12px;background:var(--well);border:1px solid transparent;border-radius:var(--radius-control);color:var(--text);padding:5px 8px;outline:none}
.devmenu input[type=number]:focus{border-color:var(--primary)}
.devmenu .ddone>summary{cursor:pointer;font-size:12px;color:var(--text-muted);padding:6px 4px}
.ddot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex:none}
.ddot.run{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 25%,transparent)}
.ddot.bad{background:var(--danger)}
@media (max-width:1100px){.pane-l{width:min(var(--pane-l),82vw)}.pane-r{width:min(var(--pane-r),92vw)}body.with-pane-l .wrap,body.with-pane-r .wrap{padding-left:clamp(22px,5vw,96px);padding-right:clamp(22px,5vw,96px)}}
@media (prefers-reduced-motion:reduce){.wrap{transition:none}.tree .tn .tc{transition:none}.devmenu{animation:none}}

/* ── the frame ───────────────────────────────────────────────
   One measure, one side margin that grows with the viewport. Bottom padding
   clears the dock (≈46px) plus its margin, so the footer is never under it. */
.wrap{max-width:var(--measure-page);margin:0 auto;padding:34px clamp(22px,5vw,96px) 130px}
@media (min-width:1101px){.wrap{padding-left:max(56px,5vw);padding-right:max(56px,5vw)}}
.view{display:none;animation:fade .28s var(--ease-out)}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── masthead ───────────────────────────────────────────── */
.label{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
h1.mast{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,38px);line-height:var(--leading-display);letter-spacing:-.02em;margin:8px 0 8px}
.mast-sub{font-size:15px;color:var(--text-secondary);max-width:var(--measure-prose);margin:0}
.meta{font-size:12px;color:var(--text-muted);display:flex;gap:18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--hair);padding-top:12px;margin-top:18px}
/* A repository path is one unbreakable token; without this it widened the page at 600px. */
.meta span{overflow-wrap:anywhere;min-width:0}
.meta .num{color:var(--text-secondary)}
.vtitle{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,2.6vw,28px);line-height:var(--leading-display);letter-spacing:-.02em;margin:34px 0 6px;display:flex;align-items:center;gap:10px}
.vsub{font-size:14.5px;color:var(--text-secondary);margin:0 0 8px;max-width:var(--measure-prose)}

/* ── blocks ─────────────────────────────────────────────── */
/* The verdict is the lede: the largest reading type on the page, on the
   canvas, opened by its tone's glyph. No box — a conclusion is not a notice. */
.verdict{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start;padding:26px 0 10px;margin:0 0 8px;font-size:16.5px;line-height:1.6;color:var(--text);max-width:calc(var(--measure-prose) + 36px)}
.verdict .vglyph{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--primary);margin-top:5px}
.verdict .vglyph .ic{width:20px;height:20px}
.verdict strong{color:var(--text);font-weight:600}
.verdict em{color:var(--accent-text);font-style:normal}
.verdict.t-danger .vglyph{color:var(--danger)}.verdict.t-ok .vglyph{color:var(--success)}
.verdict.t-warn .vglyph{color:var(--warn)}.verdict.t-info .vglyph{color:var(--info)}.verdict.t-accent .vglyph{color:var(--accent-text)}
.verdict .vpoints{list-style:none;margin:12px 0 0;padding:0;font-size:14px;line-height:1.55;color:var(--text-secondary)}
.verdict .vpoints li{position:relative;padding-left:18px;margin:0 0 6px}
.verdict .vpoints li::before{content:'';position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--hair-strong)}
.verdict .vpoints li.t-ok::before{background:var(--success)}.verdict .vpoints li.t-warn::before{background:var(--warn)}
.verdict .vpoints li.t-danger::before{background:var(--danger)}.verdict .vpoints li.t-info::before{background:var(--info)}.verdict .vpoints li.t-accent::before{background:var(--accent)}
.verdict .vlabel{display:block;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.verdict.t-danger .vlabel{color:var(--danger)}.verdict.t-warn .vlabel{color:var(--warn)}.verdict.t-ok .vlabel{color:var(--success)}

/* Stats sit on the canvas as a row of figures under one hairline: label,
   then the number, then what qualifies it. The tone colours the number and
   nothing else; a wall of eight numbers reads good / watch / bad before it
   is read, without eight boxes. */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 36px;margin:22px 0 30px;padding-top:18px;border-top:1px solid var(--hair)}
.tile{position:relative;min-width:0}
.tile .k{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tile .k .ic{width:14px;height:14px;color:var(--text-muted)}
.tile .v{font-family:var(--font-mono);font-weight:700;font-size:30px;line-height:1;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .d{font-size:12px;margin-top:7px;color:var(--text-muted);line-height:1.45}
.tile .delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-weight:600;color:var(--text-secondary)}
.tile .delta .ic{width:12px;height:12px}
.tile .delta.up{color:var(--success)}.tile .delta.down{color:var(--danger)}
.tile.t-ok .v{color:var(--success)}.tile.t-danger .v{color:var(--danger)}.tile.t-warn .v{color:var(--warn)}
.tile.t-info .v{color:var(--info)}.tile.t-accent .v{color:var(--accent-text)}

section.blk{margin:0 0 44px;scroll-margin-top:24px}
/* The hidden attribute wins over any display rule — a folded row, a folded
   section body, a filtered entry. Without this a grid row stays visible with
   hidden set, which is how 385 documents rendered behind a "show all" button
   that had nothing to show. */
[hidden]{display:none!important}
/* A folding section: the h2 is a toggle with a chevron; collapsed, the
   header tightens and the count beside it is the summary. */
.fold .shead h2 button{all:unset;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit;border-radius:var(--radius-control);min-height:28px}
.fold .shead h2 button:hover,.fold .shead h2 button:focus-visible{color:var(--primary)}
.fold .shead h2 button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.fold .shead h2 button .chev{width:12px;height:12px;color:var(--text-muted);transition:transform var(--dur) var(--ease-out);flex:none}
.fold .shead h2 button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.fold[data-collapsed="1"]{margin-bottom:0}
.fold[data-collapsed="1"] .shead{padding-top:14px;margin-bottom:0}
.fold[data-collapsed="1"]+.fold[data-collapsed="0"] .shead{padding-top:30px}
.fold .sbody{margin-top:2px}
.rowgrid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:20px 40px;margin:16px 0;align-items:start}
.rowgrid .rowcell{grid-column:span var(--span,1);min-width:0}
.rowgrid .rowcell>*{margin-top:0!important;margin-bottom:0!important}
@media (max-width:820px){.rowgrid{grid-template-columns:1fr}.rowgrid .rowcell{grid-column:span 1}}
/* The section header: display face in sentence case, a mono count beside it,
   and a hairline that runs to the edge. The rule IS the separator; there is no
   box below it. */
.shead{display:flex;align-items:center;gap:12px;padding:30px 0 10px;margin-bottom:14px}
.sicon{display:inline-flex;color:var(--text-muted);flex:none}
.sicon .ic{width:16px;height:16px}
.snum{font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.shead h2{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:var(--leading-display);margin:0;letter-spacing:-.02em}
.shead .srule{flex:1;height:1px;background:var(--hair);min-width:24px}
.shead .sd{font-size:12px;color:var(--text-muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.vtitle .vicon{display:inline-flex;color:var(--primary)}
.vtitle .vicon .ic{width:22px;height:22px}
.ic{width:16px;height:16px;display:inline-block;vertical-align:middle;flex:none}

.prose{font-size:15px;line-height:var(--leading-body);color:var(--text-secondary);max-width:var(--measure-prose)}
.prose.w-full{max-width:none}
.prose h3{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);margin:26px 0 8px;letter-spacing:-.01em}
.prose h4{font-size:13.5px;font-weight:600;color:var(--text);margin:18px 0 6px}
.prose p{margin:0 0 14px}.prose strong{color:var(--text);font-weight:600}.prose em{color:var(--accent-text);font-style:italic}
.prose ul,.prose ol{margin:0 0 14px;padding-left:20px}.prose li{margin-bottom:6px}
.prose blockquote{border-left:1px solid var(--hair-strong);margin:16px 0;padding:2px 0 2px 16px;color:var(--text-muted);font-style:italic}
.prose code{font-family:var(--font-mono);font-size:12.5px;background:var(--well);padding:1px 5px;border-radius:2px;color:var(--accent-text)}
.prose hr{border:0;border-top:1px solid var(--hair);margin:26px 0}

/* Tables: hairlines OR zebra, never both. Column heads are the one sanctioned
   overline. A row with a tone carries a rail in its first cell — the in-row
   marker, not a box. */
.tw{overflow-x:auto;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:8px 10px 9px;border-bottom:1px solid var(--hair-strong);background:var(--bg);white-space:nowrap}
th.sticky{position:sticky;top:0;z-index:2}
td{padding:10px 10px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--text-secondary)}
td:first-child,th:first-child{padding-left:8px}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--well)}
table.zebra td{border-bottom:0}
table.zebra tbody tr:nth-child(even) td{background:var(--wash)}
table.zebra tbody tr:hover td{background:var(--well)}
tbody tr.t-danger td:first-child{box-shadow:inset 2px 0 0 var(--danger)}
tbody tr.t-warn td:first-child{box-shadow:inset 2px 0 0 var(--warn)}
tbody tr.t-ok td:first-child{box-shadow:inset 2px 0 0 var(--success)}
tbody tr.t-info td:first-child{box-shadow:inset 2px 0 0 var(--info)}
table.dense td,table.dense th{padding:6px 8px}
.unfold{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-sans);font-size:12.5px;padding:9px 8px;background:transparent;color:var(--primary);border:0;cursor:pointer;min-height:36px;border-radius:999px;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.unfold:hover,.unfold:focus-visible{color:var(--accent-text);background:var(--well)}
.cap{font-size:12px;color:var(--text-muted);margin:8px 0 0;max-width:var(--measure-prose)}

/* A chart sits on the canvas with a sentence-case title above it. */
.chartbox{margin:14px 0}
.chartbox h4{font-size:13px;font-weight:600;color:var(--text);margin:0 0 10px}
.chartbox canvas{max-height:300px}

.meter{display:grid;grid-template-columns:minmax(120px,1fr) auto minmax(90px,2fr) auto;gap:12px;align-items:center;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--hair)}
.meter:last-child{border-bottom:0}
.meter .mn{color:var(--text-secondary)}
.meter .mc{color:var(--text-muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px}
.meter .track{height:4px;background:var(--hair);border-radius:2px;overflow:hidden}
.meter .fill{height:100%;background:var(--primary)}
.meter .mr{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}

/* ── the Style view ───────────────────────────────────────────────────────
   A design system is shown, not described: chips painted with the token's own
   value, type set in the face it names, mockups at a size the eye can judge. */
.swgroups{display:flex;flex-direction:column;gap:22px;margin:16px 0}
.swgroup h4{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font:600 11px/1 var(--font-mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.swgroup h4 span{font-weight:400;opacity:.6}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.sw{margin:0;display:flex;flex-direction:column;gap:7px}
/* The chip is painted with the raw token value. A checkerboard behind it means
   a translucent token reads as translucent rather than as a lighter colour,
   and an unresolved value reads as nothing at all rather than as white. */
.swchip{display:block;height:52px;border-radius:var(--radius-card);border:1px solid var(--hair);
  background-image:linear-gradient(45deg,var(--well) 25%,transparent 25%,transparent 75%,var(--well) 75%),
    linear-gradient(45deg,var(--well) 25%,transparent 25%,transparent 75%,var(--well) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px}
.sw figcaption{display:flex;flex-direction:column;gap:2px;font-size:11.5px;line-height:1.45}
.sw figcaption b{font-weight:600;color:var(--text)}
.sw figcaption code{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary)}
.sw figcaption span{color:var(--text-muted);font-size:10.5px}

.spec{display:flex;flex-direction:column;margin:16px 0;border-top:1px solid var(--hair)}
.specrow{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--hair)}
.specmeta{display:flex;flex-direction:column;gap:3px}
.specmeta b{font-size:12.5px;font-weight:600}
.specmeta code{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}
.specmeta span{font-size:11px;color:var(--text-muted);line-height:1.45}
.specsample{margin:0;color:var(--text);line-height:1.2;overflow-wrap:anywhere}
@media (max-width:720px){.specrow{grid-template-columns:1fr;gap:8px}}

.gal{display:grid;grid-template-columns:repeat(var(--galcols,3),minmax(0,1fr));gap:14px;margin:16px 0}
.galitem{margin:0;display:flex;flex-direction:column;gap:8px;cursor:zoom-in}
.galshot{display:block;overflow:hidden;border:1px solid var(--hair);border-radius:var(--radius-card);
  background:var(--well);transition:border-color var(--dur) var(--ease-out)}
.galitem:hover .galshot{border-color:var(--primary)}
.galshot img{display:block;width:100%;height:auto}
/* A frame with no picture is a link, not something to zoom, and the cursor
   should say which. */
.galnone{display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--text-muted)}
.galitem:has(.galnone){cursor:pointer}
.galnone .ic{width:20px;height:20px}
.galitem figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:11.5px;line-height:1.45}
.galitem figcaption b{font-weight:600;flex:1 1 100%}
.galitem figcaption time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}
.galitem figcaption span{flex:1 1 100%;color:var(--text-muted);font-size:10.5px}
.galbadge{padding:1px 7px;border:1px solid var(--hair-strong);border-radius:100px;
  font:500 10px/1.6 var(--font-mono);color:var(--text-secondary)}
.galitem.t-ok .galbadge{border-color:var(--success);color:var(--success)}
.galitem.t-warn .galbadge{border-color:var(--warn);color:var(--warn)}
.galitem.t-danger .galbadge{border-color:var(--danger);color:var(--danger)}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gal{grid-template-columns:1fr}}

/* A diagram is a frame with an expand control. The control is always in the
   DOM for the keyboard and appears on hover or focus for the pointer, so it
   never sits over the drawing while the drawing is being read. */
.mermaid-box{position:relative;margin:14px 0;padding:0;overflow-x:auto;cursor:zoom-in;border-radius:var(--radius-card)}
.mermaid-box:hover{background:var(--wash)}
.mermaid-box .missing{padding:22px 16px;text-align:center;font-size:12.5px;color:var(--text-muted);line-height:1.6}
.dgzoom{position:absolute;top:6px;right:6px;display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;font:500 11px/1 var(--font-sans);letter-spacing:.02em;color:var(--text-secondary);
  background:color-mix(in srgb,var(--surface-raised) 92%,transparent);border:1px solid var(--hair);
  border-radius:var(--radius-control);cursor:zoom-in;opacity:0;transition:opacity var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.dgzoom .ic{width:12px;height:12px}
.mermaid-box:hover .dgzoom,.dgzoom:focus-visible{opacity:1}
.dgzoom:hover{color:var(--primary);border-color:var(--primary)}

/* The lightbox: the whole viewport, a thin bar of controls, and a stage the
   reader drags. It sits above the dock (z-index 60) and the results panel (70)
   because while it is open it IS the page. */
.lbox{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--bg) 97%,#000);animation:lbin .14s var(--ease-out)}
@keyframes lbin{from{opacity:0}to{opacity:1}}
body.lbon{overflow:hidden}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;
  padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--surface)}
.lbtitle{font-family:var(--font-display);font-size:14px;letter-spacing:-.01em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtools{display:flex;align-items:center;gap:6px;flex:none}
.lbtools button{all:unset;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:var(--radius-control);color:var(--text-secondary);cursor:pointer;
  transition:color var(--dur) var(--ease-out),background var(--dur) var(--ease-out)}
.lbtools button:hover{color:var(--text);background:var(--surface-active)}
.lbtools button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.lbtools .ic{width:15px;height:15px}
.lbpct{min-width:52px;text-align:center;font-family:var(--font-mono);font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--text-muted)}
.lbstage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;background:var(--well)}
.lbstage.dragging{cursor:grabbing}
.lbcanvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.lbcanvas svg{display:block;width:100%;height:100%;max-width:none}
.lbhint{flex:none;margin:0;padding:8px 16px;text-align:center;font-size:11px;color:var(--text-muted);
  border-top:1px solid var(--hair);background:var(--surface)}
@media (prefers-reduced-motion:reduce){.lbox{animation:none}}

.tl{border-left:1px solid var(--hair-strong);margin:16px 0;padding-left:0}
.tl .ev{position:relative;padding:0 0 20px 22px}
.tl .ev::before{content:'';position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--primary)}
.tl .ev.t-danger::before{background:var(--danger)}.tl .ev.t-ok::before{background:var(--success)}
.tl .ev.t-warn::before{background:var(--warn)}.tl .ev.t-info::before{background:var(--info)}
.tl .when{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tl h4{font-family:var(--font-display);font-size:14px;margin:2px 0 4px;font-weight:600}
.tl p{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.6;max-width:var(--measure-prose)}

/* Cards are not boxes. A card is a titled entry under its own hairline, in a
   grid whose gutters do the grouping; a tone is a dot before the title. The
   `list` layout stacks them as ledger rows — title, badges and body on one
   hairline-separated row each — for a set the reader scans down. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 40px;margin:14px 0}
.grid[style*="--cols"]{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
@media (max-width:820px){.grid[style*="--cols"]{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.card{border-top:1px solid var(--hair);padding:14px 0 4px;min-width:0}
.card h4{font-family:var(--font-display);font-size:15px;margin:0 0 2px;font-weight:600;line-height:var(--leading-display);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card h4 .ic{width:15px;height:15px;color:var(--text-muted)}
.card h4 a{color:inherit;border:0}
.card h4 a:hover{color:var(--primary)}
.card h4 a::after{content:'→';margin-left:7px;color:var(--text-muted);font-weight:400;transition:transform var(--dur) var(--ease-out),color var(--dur) var(--ease-out);display:inline-block}
.card h4 a:hover::after{color:var(--primary);transform:translateX(3px)}
.card.t-ok h4::before,.card.t-danger h4::before,.card.t-warn h4::before,.card.t-info h4::before,.card.t-accent h4::before{content:'';width:7px;height:7px;border-radius:50%;flex:none}
.card.t-ok h4::before{background:var(--success)}.card.t-danger h4::before{background:var(--danger)}
.card.t-warn h4::before{background:var(--warn)}.card.t-info h4::before{background:var(--info)}.card.t-accent h4::before{background:var(--accent)}
.card .sub{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.card .cb{font-size:13px;line-height:1.6;color:var(--text-secondary);margin:8px 0}
.card .row{font-size:12.5px;color:var(--text-muted);margin-bottom:3px}
.card .row b{color:var(--text-secondary);font-weight:600}
.card .bd{margin:4px 0 2px}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .card{display:grid;grid-template-columns:minmax(160px,1fr) 2fr;gap:6px 32px;align-items:baseline;padding:14px 0}
.grid.list .card h4{margin:0}
.grid.list .card .bd{grid-column:1;margin:0}
.grid.list .card .sub{grid-column:1;margin:0}
.grid.list .card .cb{grid-column:2;grid-row:1/span 3;margin:0;font-size:13.5px}
.grid.list .card .row{grid-column:2}
@media (max-width:700px){.grid.list .card{grid-template-columns:1fr}.grid.list .card .cb{grid-column:1;grid-row:auto}}
/* Badges are pills in sentence case. A tone tints; the neutral one whispers. */
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;margin:0 4px 4px 0;line-height:1.5;
background:var(--well);color:var(--text-secondary);border:1px solid var(--hair)}
.badge.t-danger{background:var(--danger-subtle);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.badge.t-ok{background:var(--success-subtle);color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.badge.t-warn{background:var(--warn-subtle);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.badge.t-info{background:var(--info-subtle);color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.badge.t-accent{background:var(--accent-subtle);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* A callout is a glyph, a titled line in its tone and a paragraph. Only a
   warning or a danger earns a wash — meaning carries the background, not the
   block type — and nothing earns a border. */
.callout{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:12px 0;margin:14px 0;max-width:calc(var(--measure-prose) + 32px)}
.callout .cglyph{color:var(--primary);padding-top:2px}
.callout .cglyph .ic{width:18px;height:18px}
.callout.t-danger .cglyph{color:var(--danger)}.callout.t-warn .cglyph{color:var(--warn)}.callout.t-ok .cglyph{color:var(--success)}.callout.t-info .cglyph{color:var(--info)}.callout.t-accent .cglyph{color:var(--accent-text)}
.callout .ct{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:4px;line-height:var(--leading-display)}
.callout p{margin:0;font-size:13.5px;line-height:1.65;color:var(--text-secondary)}
.callout.t-danger,.callout.t-warn{padding:14px 16px 14px 14px;border-radius:var(--radius-card)}
.callout.t-danger{background:var(--danger-subtle)}.callout.t-danger .ct{color:var(--danger)}
.callout.t-warn{background:var(--warn-subtle)}.callout.t-warn .ct{color:var(--warn)}
.callout.t-ok .ct{color:var(--success)}
.callout.t-info .ct{color:var(--info)}
.callout.t-neutral .ct{color:var(--text)}
.callout.t-accent .ct{color:var(--accent-text)}

/* Code is a well — it recesses into the page, as an input does. */
pre.code{background:var(--well);border:0;border-radius:var(--radius-card);padding:14px 16px;overflow-x:auto;margin:14px 0;
font-family:var(--font-mono);font-size:12.5px;line-height:1.55;color:var(--text-secondary);white-space:pre}
pre.ascii{white-space:pre;font-size:11.5px;line-height:1.35}

/* ── media + interactive demo ───────────────────────────
   The capture surfaces. A stage (video, still, frame scrubber or DOM replay)
   with a beat list beside it: the shot log made navigable, so a reviewer can
   jump to the beat they want to criticise instead of scrubbing for it. A stage
   is a bounded frame by nature — a picture has edges — so it keeps one hairline. */
.stage{border:1px solid var(--hair);border-radius:var(--radius-card);margin:16px 0;overflow:hidden}
.stage .screen{background:var(--well);display:block;position:relative;line-height:0}
/* Never upscale a capture. A frame set is reviewed for pixel-level defects —
   spacing, contrast, a clipped glyph — and stretching a 900px frame across a
   1200px column invents detail that was not captured. Cap at natural size and
   centre; only shrink when the column is narrower than the frame. */
.stage .screen video,.stage .screen img{display:block;max-width:100%;width:auto;height:auto;max-height:66vh;margin:0 auto}
/* Audio has no picture, so the stage gives it room to breathe rather than a
   letterboxed void: full-width native controls on the canvas, vertically padded. */
.stage .screen audio{display:block;width:100%;padding:18px 16px;line-height:normal;box-sizing:border-box}
/* ── deck ───────────────────────────────────────────────────────────────
   Explicit-request only (see Skill("write-report")). One viewport per slide,
   scroll-snapped inside the view rather than on the page, so the report's own
   dock keeps working and a deck stays one view among several. */
/* A deck owns the viewport. Left under the masthead it became a 525px scroller
   inside a 633px page — two nested scroll contexts, and the reader has to guess
   which one a wheel event will move. `deck-mode` retires the report chrome for
   as long as a deck view is the active one. */
.deck{position:relative;height:calc(100vh - 52px);overflow-y:auto;scroll-snap-type:y mandatory;
  scroll-behavior:smooth;margin:0 -22px;padding:0}
body.deck-mode #adt-masthead,body.deck-mode .view.on>.vtitle,body.deck-mode .view.on>.vsub{display:none}
body.deck-mode footer,body.deck-mode .outline{display:none}
/* In deck mode the page itself must not scroll — only the deck does. Without
   this the wheel moves whichever context the pointer happens to be over. */
body.deck-mode{overflow:hidden}
.dkbar{position:sticky;top:0;z-index:8;height:2px;background:var(--hair)}
.dkfill{height:100%;width:0;background:var(--primary);transition:width .18s linear}
.dkchrome{position:sticky;top:2px;z-index:8;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:8px 22px;pointer-events:none}
.dkdots{display:flex;gap:7px;pointer-events:auto}
.dkdot{width:8px;height:8px;padding:0;border-radius:50%;border:1px solid var(--text-muted);
  background:transparent;cursor:pointer;transition:background .15s,border-color .15s}
.dkdot.on{background:var(--primary);border-color:var(--primary)}
.dkdot:hover{border-color:var(--accent)}
.dkcount{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-muted)}
.dkcount b{color:var(--text);font-weight:400}
.dkslide{min-height:calc(100vh - 110px);scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;align-items:center;padding:34px 22px 46px;border-bottom:1px solid var(--hair)}
.dkslide:last-child{border-bottom:0}
.dkin{width:100%;max-width:1180px;margin:0 auto;opacity:0;transform:translateY(10px);
  transition:opacity .34s var(--ease-out),transform .34s var(--ease-out)}
.dkslide.seen .dkin{opacity:1;transform:none}
/* Read from further away: every step up one notch from report scale. */
.dkslide .dkt{font-family:var(--font-display);font-size:clamp(24px,3.2vw,38px);line-height:1.15;
  margin:0 0 6px;color:var(--text)}
.dkslide .dknote{font-size:15px;color:var(--text-secondary);margin:0 0 20px}
.dkslide .tile .v{font-size:clamp(28px,3.6vw,44px)}
.dkslide table{font-size:14px}
.dkslide .verdict{font-size:18px;line-height:1.6}
.dkslide.k-title{text-align:center}
.dkslide.k-title .dkt{font-size:clamp(34px,6vw,68px)}
.dkslide.k-title .dkin{max-width:900px}
.dkslide.k-divider{background:var(--surface)}
.dkslide.k-divider .dkt{font-size:clamp(28px,4.4vw,52px);color:var(--accent-text)}
.dkslide.k-quote .dkin{max-width:860px}
.dkslide.k-quote .dkt{font-family:var(--font-sans);font-weight:400;font-style:italic}
.dkslide.k-full-bleed .dkin{max-width:none}
.dkslide.k-comparison .dkin{max-width:1320px}
@media (max-width:700px){
  .deck{height:auto;overflow:visible;scroll-snap-type:none;margin:0}
  .dkslide{min-height:0;padding:26px 0 30px}
  .dkin{opacity:1;transform:none}
  .dkchrome{display:none}
}
@media (prefers-reduced-motion:reduce){
  .deck{scroll-behavior:auto}
  .dkin{transition:none;opacity:1;transform:none}
}

/* A voice note is a document with a play button, not a video without a picture. */
.stage.voicenote .screen{background:var(--well)}
.stage.voicenote .screen audio{display:block;width:100%;padding:14px 14px 12px;line-height:normal;box-sizing:border-box}
.vnhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--hair);line-height:1.4}
.vnhead .vnt{font-size:13px;font-weight:600;color:var(--text)}
.vnhead .vnm{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.vntx{border-top:1px solid var(--hair);line-height:1.4}
.vntx>summary{cursor:pointer;padding:9px 14px;font-size:12.5px;color:var(--primary);user-select:none}
.vntx>summary:hover{color:var(--accent-text)}
.vntx[open]>summary{border-bottom:1px solid var(--hair)}
.vnbody{padding:12px 14px 14px;font-size:13.5px;line-height:1.7;color:var(--text-secondary)}
.stage .screen .demoroot{width:100%;min-height:220px;background:var(--well);line-height:normal}
.stage .screen .demoroot .replayer-wrapper{margin:0 auto}
.stage .missing{padding:28px 16px;text-align:center;font-size:12.5px;color:var(--text-muted);line-height:1.6}
.stage .missing b{display:block;color:var(--warn);font-size:12.5px;font-weight:600;margin-bottom:6px}
.stage .bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--hair);flex-wrap:wrap}
.stage .bar .t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage .bar input[type=range]{flex:1 1 180px;min-width:120px;accent-color:var(--primary);height:22px;cursor:pointer}
.stage .bar input[type=range]:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.stage .beats{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair);max-height:230px;overflow-y:auto}
.stage .beats li{border-bottom:1px solid var(--hair)}
.stage .beats li:last-child{border-bottom:0}
.stage .beat{display:flex;gap:11px;align-items:baseline;width:100%;min-height:44px;padding:10px 13px;background:none;border:0;
text-align:left;font:inherit;color:var(--text-secondary);cursor:pointer;transition:background .12s var(--ease-out),color .12s var(--ease-out)}
.stage .beat:hover{background:var(--well);color:var(--text)}
.stage .beat:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.stage .beat:active{background:var(--surface-active)}
.stage .beat[aria-current=true]{background:var(--primary-subtle);color:var(--text);box-shadow:inset 2px 0 0 var(--primary)}
.stage .beat .at{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:52px}
.stage .beat[aria-current=true] .at{color:var(--primary)}
.stage .beat .bt{font-size:12.5px;line-height:1.5}
.stage .beat .bn{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
.stage .beat[disabled]{cursor:not-allowed;opacity:.45}
.stage .alt{font-size:11.5px;color:var(--text-muted);padding:8px 13px;border-top:1px solid var(--hair);line-height:1.55}
@media (prefers-reduced-motion:reduce){.stage .beat{transition:none}}

.mx td.cell{text-align:center;font-weight:700;font-family:var(--font-mono)}
.mx .c-ok{color:var(--success)}.mx .c-partial{color:var(--warn)}.mx .c-missing{color:var(--danger)}.mx .c-na{color:var(--text-muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:8px}

.difftable td.add{color:var(--success);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.difftable td.del{color:var(--danger);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ── docs reader ────────────────────────────────────────── */
.reader{display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:start}
@media(max-width:820px){.reader{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:24px;max-height:calc(100vh - 100px);overflow:auto;border-left:1px solid var(--hair);padding-left:14px}
.toc a{display:block;font-size:12px;padding:3px 0;color:var(--text-muted);border:0}
.toc a:hover{color:var(--primary)}.toc a.h3{padding-left:11px;font-size:11.5px;opacity:.85}
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 40px}
.dcard{border-top:1px solid var(--hair);padding:12px 0 10px;cursor:pointer}
.dcard:hover h4{color:var(--primary)}
.dcard h4{font-family:var(--font-display);font-size:14px;margin:0 0 3px;color:var(--text);font-weight:600;transition:color var(--dur) var(--ease-out)}
.dcard p{margin:0 0 6px;font-size:12px;color:var(--text-muted)}
.dcard .fl3{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}
.crumb{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.crumb button{font-family:var(--font-sans);font-size:12px;background:transparent;border:0;color:var(--primary);padding:4px 10px;border-radius:999px;cursor:pointer}
.crumb button:hover{background:var(--well);color:var(--accent-text)}

/* Documents as a shelf: a row per document under its directory's heading. */
.dgroup{margin:0 0 6px}
.drow{display:grid;grid-template-columns:minmax(200px,2fr) 3fr minmax(140px,1fr);gap:6px 24px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer}
.drow:hover .dt{color:var(--primary)}
.drow .dt{font-weight:500;color:var(--text);transition:color var(--dur) var(--ease-out)}
.drow .ds{font-size:12.5px;color:var(--text-secondary)}
.drow .dp{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right;overflow-wrap:anywhere}
@media (max-width:820px){.drow{grid-template-columns:1fr}.drow .dp{text-align:left}}
/* A decision handed back: the question, the options with their consequences,
   the recommendation, the silence default. */
.decision .dq{font-size:15.5px;color:var(--text);margin:0 0 12px;max-width:var(--measure-prose);line-height:1.55}
.decision .dn{font-size:13.5px;color:var(--text-secondary);margin:0 0 10px;max-width:var(--measure-prose)}
.decision .dopts{margin:6px 0 12px;padding-left:22px;max-width:var(--measure-prose)}
.decision .dopts li{margin:0 0 7px;font-size:13.5px;color:var(--text-secondary);line-height:1.55}
.decision .dopts li b{color:var(--text);font-weight:600}
.decision .drec,.decision .dsil{margin:0 0 6px;font-size:13.5px;max-width:var(--measure-prose)}
.decision .drec b{color:var(--accent-text);font-weight:600;margin-right:6px}
.decision .dsil b{color:var(--text-muted);font-weight:600;margin-right:6px}
.decision .dmissing{font-size:13px;color:var(--warn);margin:0 0 8px}
.decision .dmeta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:8px}
/* Work rows: level pill, title, provenance — folded past twelve. */
.wgroup>summary{cursor:pointer;font-size:12.5px;color:var(--primary);padding:2px 0 8px;list-style:none}
.wgroup>summary::-webkit-details-marker{display:none}
.wgroup>summary::before{content:'\25B8';display:inline-block;margin-right:8px;font-size:11px;color:var(--text-muted);transition:transform .15s}
.wgroup[open]>summary::before{transform:rotate(90deg)}
.wrow{display:grid;grid-template-columns:auto minmax(220px,2fr) 3fr;gap:4px 16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair)}
.wrow .badge{margin:0}
.wrow .wt{color:var(--text);font-size:13.5px}
.wrow .wm{font-size:12px;color:var(--text-muted);overflow-wrap:anywhere}
.wrow .wm b{color:var(--danger);font-weight:600}
.wrow.offmain .wt{color:var(--text-secondary)}
@media (max-width:820px){.wrow{grid-template-columns:auto 1fr}.wrow .wm{grid-column:2}}

/* ── questionnaire ──────────────────────────────────────── */
.qprogress{position:sticky;top:12px;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);box-shadow:0 12px 30px -14px rgba(0,0,0,.85);
border:1px solid var(--hair);border-radius:var(--radius-floating);padding:11px 16px;margin:0 0 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qprogress .pt{font-size:12.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.qprogress .pt b{color:var(--text);font-family:var(--font-mono)}
.qprogress .ptrack{flex:1;min-width:120px;height:4px;background:var(--hair);border-radius:2px;overflow:hidden}
.qprogress .pfill{height:100%;background:var(--primary);transition:width .25s var(--ease-out)}
.qprogress .pfill.done{background:var(--success)}
/* Buttons are quiet text pills: no resting boundary, a recess on resolve. The
   dominant action keeps the brand colour in its label; that is the hierarchy. */
.btn{font-family:var(--font-sans);font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:999px;cursor:pointer;min-height:32px;
background:transparent;color:var(--text-secondary);border:1px solid transparent;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.btn:hover,.btn:focus-visible{background:var(--well);color:var(--text)}
.btn.primary{color:var(--primary);font-weight:600}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--well);color:var(--accent-text)}
.btn.copied{color:var(--success)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

.qcard{scroll-margin-top:116px;border-top:1px solid var(--hair);padding:24px 0 8px;margin:0 0 12px;position:relative}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qid{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--text-muted);display:inline-flex;align-items:center;gap:7px}
.qid::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--hair-strong);flex:none}
.qcard.lb .qid::before{background:var(--accent)}
.qcard.answered .qid::before{background:var(--success)}
.qcard h3{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:var(--leading-display)}
.qcard .qctx{font-size:13.5px;line-height:1.7;color:var(--text-secondary);margin:10px 0 16px;max-width:var(--measure-prose)}
.qcard .qctx p{margin:0 0 10px}
.qcard .qctx code{font-family:var(--font-mono);font-size:12px;background:var(--well);padding:1px 5px;border-radius:2px;color:var(--accent-text)}

/* An option is a selectable row: a recess on hover, a brand wash when chosen. */
.opt{border-radius:var(--radius-card);margin-bottom:4px;background:transparent;transition:background var(--dur) var(--ease-out)}
.opt:hover{background:var(--well)}
.opt.sel{background:var(--primary-subtle)}
.opt .ohead{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;cursor:pointer}
.opt input[type=radio]{margin:3px 0 0;accent-color:var(--primary);width:14px;height:14px;flex:none}
.opt .obody{flex:1;min-width:0;display:block}
.opt .okey{font-family:var(--font-mono);font-weight:700;color:var(--accent-text);margin-right:7px}
.opt .oline{display:block}
.opt .olabel{font-weight:600;color:var(--text);font-size:13.5px}
.opt .osum{display:block;font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-top:5px}
.opt .orec{display:inline-block;font-size:11px;font-weight:500;color:var(--accent-text);
background:var(--accent-subtle);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:1px}
.opt .ometa{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:7px}
.opt .ometa b{color:var(--text-secondary)}
.opt .more{font-size:12px;color:var(--primary);background:none;border:0;cursor:pointer;padding:2px 0 10px 39px}
.opt .more:hover{color:var(--accent-text)}
.odetail{display:none;padding:0 14px 14px 39px}
.odetail.on{display:block}
.odetail .prose{font-size:13px;max-width:78ch}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(max-width:640px){.pc{grid-template-columns:1fr}}
.pc ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;line-height:1.6}
.pc .h{font-size:12px;font-weight:600;color:var(--text-muted)}
.pc .pros li{color:var(--success)}.pc .cons li{color:var(--danger)}
.pc li span{color:var(--text-secondary)}

.qfields{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.qfields label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px}
.qfields textarea,.qfields input[type=text]{width:100%;font-family:var(--font-sans);font-size:13px;background:var(--well);color:var(--text);
border:1px solid transparent;border-radius:var(--radius-control);padding:9px 11px;outline:none;resize:vertical;line-height:1.6}
.qfields textarea:focus,.qfields input[type=text]:focus{border-color:var(--primary)}
.qfields .mis{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;color:var(--text-muted)}
.qfields .mis input{accent-color:var(--danger);width:13px;height:13px}
.qfields .mis label{margin:0;font-size:12px;font-weight:400;color:var(--text-muted)}
.miswhy{display:none;margin-top:9px}.miswhy.on{display:block}

.framing{background:var(--warn-subtle);border-radius:var(--radius-card);padding:15px 17px;margin:0 0 22px}
.framing .ft{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--warn);margin-bottom:5px}
.framing p{font-size:13px;color:var(--text-secondary);margin:0 0 10px;line-height:1.6}
.framing textarea{width:100%;font-family:var(--font-sans);font-size:13px;background:var(--well);color:var(--text);
border:1px solid transparent;border-radius:var(--radius-control);padding:9px 11px;outline:none;resize:vertical;line-height:1.6}
.framing textarea:focus{border-color:var(--warn)}

.qfoot{border-top:1px solid var(--hair);padding-top:18px;margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qfoot .hint{font-size:12.5px;color:var(--text-muted);max-width:60ch;line-height:1.6}
.unanswered{font-size:12px;color:var(--danger);margin-top:10px}
.unanswered b{color:var(--danger)}
.dft{border-top:1px solid var(--hair);margin:0}
.dft>summary{cursor:pointer;padding:12px 0;list-style:none;display:block}
.dft>summary::-webkit-details-marker{display:none}
.dft>summary:before{content:'\25B8';display:inline-block;margin-right:9px;color:var(--text-muted);
  transition:transform .15s;font-size:11px}
.dft[open]>summary:before{transform:rotate(90deg)}
.dft>summary:hover .dft-t{color:var(--primary)}
.dft-t{font-weight:600;font-size:15px;font-family:var(--font-display)}
.dft-s{display:block;margin:5px 0 0 20px;color:var(--text-secondary);font-size:13.5px;line-height:1.55}
.dft-b{margin-left:9px;display:inline-flex;gap:5px;vertical-align:middle;flex-wrap:wrap}
.dft-body{padding:4px 0 16px 20px;font-size:13.5px;line-height:1.7;color:var(--text-secondary);max-width:96ch}
.dft-body>p{margin:0 0 12px}
.dft-body strong{color:var(--text);font-weight:600}
.dft-body em{color:var(--accent-text);font-style:italic}
.dft-body code{font-family:var(--font-mono);font-size:12.5px}
.dv{margin:0 0 14px}
.dv:last-child{margin-bottom:0}
.dv-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 6px}
.dv-l{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent-text)}
.dv-p{font-size:11px;color:var(--text-muted);background:var(--well);border-radius:999px;padding:1px 8px}
.dv-m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-left:auto}
pre.code.draft{white-space:pre-wrap;word-break:break-word;max-height:none;line-height:1.62;
  font-family:var(--font-sans);font-size:13.5px}
textarea.manual-copy{width:100%;margin-top:10px;font-family:var(--font-mono);font-size:11.5px;background:var(--well);
color:var(--text);border:1px solid var(--warn);border-radius:var(--radius-control);padding:9px 11px;resize:vertical;line-height:1.5}

/* ── decisions ──────────────────────────────────────────── */
.dec{border-top:1px solid var(--hair);padding:14px 0 12px;margin:0}
.dec .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dec .dh::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary);align-self:center;flex:none}
.dec.contra .dh::before{background:var(--warn)}
.dec h4{font-family:var(--font-display);font-size:15px;margin:0;font-weight:600}
.dec .dn{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.dec .db{font-size:13px;color:var(--text-secondary);margin:7px 0 0;line-height:1.65;max-width:var(--measure-prose)}
.dec .contrab{font-size:12.5px;color:var(--warn);margin:9px 0 0;padding-left:12px;border-left:1px solid var(--warn);line-height:1.6}

/* ── evidence ───────────────────────────────────────────── */
.ev-item{border-top:1px solid var(--hair);padding:14px 0 10px;margin-bottom:8px}
.ev-item .eh{padding:0 0 8px}
.ev-item h4{font-family:var(--font-display);font-size:14px;margin:0;font-weight:600}
.ev-item .ecmd{font-family:var(--font-mono);font-size:12px;color:var(--accent-text);background:var(--well);padding:9px 14px;border-radius:var(--radius-card) var(--radius-card) 0 0;overflow-x:auto;white-space:pre}
.ev-item .eout{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);background:var(--well);padding:10px 14px;max-height:260px;overflow:auto;white-space:pre-wrap;border-top:1px solid var(--hair);border-radius:0 0 var(--radius-card) var(--radius-card)}
.ev-item .ev-v{padding:10px 0 0;font-size:12.5px;color:var(--text-secondary)}
.ev-item .ev-v b{color:var(--success)}
.ev-item.t-danger .ev-v b{color:var(--danger)}

/* ── footer + prompt ────────────────────────────────────── */
footer.foot{border-top:1px solid var(--hair);margin-top:64px;padding-top:18px;font-size:12px;color:var(--text-muted)}
footer.foot .srcs{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
footer.foot code{font-family:var(--font-mono)}
.prompt-toggle{font-family:var(--font-sans);font-size:12.5px;font-weight:500;padding:6px 13px;background:transparent;
color:var(--text-secondary);border:1px solid transparent;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:32px}
.prompt-toggle:hover{color:var(--text);background:var(--well)}
.prompt-toggle .arrow{transition:transform .2s;display:inline-block;font-size:10px}
.prompt-toggle.open .arrow{transform:rotate(90deg)}
.prompt-container{display:none;margin-top:12px;position:relative}
.prompt-container.open{display:block}
.prompt-pre{background:var(--well);border:0;padding:16px;padding-top:40px;font-family:var(--font-mono);
font-size:11.5px;line-height:1.6;color:var(--text);overflow:auto;white-space:pre-wrap;word-wrap:break-word;max-height:460px;border-radius:var(--radius-card)}
.prompt-copy{position:absolute;top:6px;right:6px}
.codewrap{position:relative}
.code-copy{position:absolute;top:6px;right:6px;z-index:2;opacity:.55;transition:opacity .15s}
.codewrap:hover .code-copy,.code-copy:focus-visible{opacity:1}
.code-copy.copied{opacity:1}
.codewrap .code{padding-right:92px}

/* ── dashboard masthead ─────────────────────────────────── */
.stale{margin:14px 0 4px;padding:12px 16px;background:var(--warn-subtle);color:var(--text);font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--radius-card)}
.btn.regen{color:var(--primary);font-weight:600}
.meta-regen{margin-left:auto}

/* ── ledger view ────────────────────────────────────────── */
.lfilters{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 12px}
.lfilters button{font-family:var(--font-sans);font-size:12.5px;padding:5px 12px;background:transparent;color:var(--text-muted);border:1px solid transparent;border-radius:999px;cursor:pointer;min-height:32px;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.lfilters button:hover,.lfilters button:focus-visible{color:var(--text);background:var(--well)}
.lfilters button[aria-pressed="true"]{background:var(--well);color:var(--primary)}
.lentries{display:grid;gap:0}
.lentry .grid{margin:0}
.lentry[hidden]{display:none}

@media print{
  .dock,.outline,.qprogress,.prompt-toggle,.prompt-container,.btn{display:none!important}
  .view{display:block!important}
  body{background:#fff;color:#000}
  /* A deck prints ONE SLIDE PER PAGE. Without these rules it prints one page
     for the whole deck, whatever its length — measured 2026-09-07, eight slides
     to a single letter page. Three separate causes, all of which must be
     undone: the deck is a viewport-height `overflow-y:auto` scroller, the page
     itself is `overflow:hidden` while a deck is active, and every slide's body
     sits at `opacity:0` until the IntersectionObserver marks it seen — so the
     slides that never scrolled into view print BLANK rather than absent, which
     is the worse of the two failures. `break-after` and its `page-break-*`
     alias are both set because print support for the modern property is
     uneven and the cost of the pair is one line. */
  body.deck-mode{overflow:visible}
  .deck{height:auto;overflow:visible;scroll-snap-type:none;margin:0}
  .dkbar,.dkchrome{display:none!important}
  .dkslide{min-height:0;display:block;border-bottom:0;padding:0 0 18px;
    break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .dkslide:last-child{break-after:auto;page-break-after:auto}
  .dkin{opacity:1!important;transform:none!important;max-width:none}
}
@media (max-width:700px){
  .dock .tools .nl{display:none}
  .wrap{padding:20px 16px 100px}
  html{font-size:13px}
  .dock{left:12px;right:12px;bottom:12px;transform:none;max-width:none;padding:6px 8px;gap:6px}
  .brand{display:none}
  .dock .nav{max-width:none;flex:1}
  .search input{width:44px;padding-left:9px}
  .search input:focus{width:min(60vw,240px)}
  .results{width:calc(100vw - 24px);right:-8px}
  .tiles{gap:16px 24px}
  .tile .v{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  .results.on{animation:none}
  .search input,.outline,.outline *,.btn,.dock .nav button,a{transition:none}
  .view{animation:none}
}

/* ── the Product and Technical views ─────────────────────────────────────
   Organised by intent: a brief, health signals, milestones with gates, the
   scope, activity lanes and the folding workstreams. Same surface language:
   hairlines and whitespace, mono for numbers, one accent. */
.brief{margin:6px 0 18px;max-width:var(--measure-page)}
.brief .bhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.brief .bhead h3{font-family:var(--font-display);font-size:19px;margin:0;letter-spacing:-.02em}
.badge.stage{font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.brief .blede{font-size:16px;line-height:1.55;max-width:var(--measure-prose);margin:0 0 14px;color:var(--text)}
.brief .brows{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 32px;margin:0}
.brief .brows>div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--hair);align-items:baseline}
.brief .brows dt{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0}
.brief .brows dd{margin:0;font-size:13.5px;color:var(--text-secondary)}
.brief .blinks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12.5px}

.signals{margin:6px 0 10px}
.signals h4{font-family:var(--font-display);font-size:14px;margin:0 0 6px}
.sig{display:grid;grid-template-columns:10px minmax(150px,1fr) minmax(70px,auto) 3fr auto;gap:0 16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair)}
.sig .sdot{width:8px;height:8px;border-radius:50%;background:var(--hair-strong);align-self:center}
.sig.t-ok .sdot{background:var(--success)}.sig.t-warn .sdot{background:var(--warn)}.sig.t-danger .sdot{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent)}.sig.t-info .sdot{background:var(--info)}.sig.t-accent .sdot{background:var(--accent)}
.sig .sl{font-weight:500;color:var(--text)}
.sig .sv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--text)}
.sig.t-danger .sv{color:var(--danger)}.sig.t-warn .sv{color:var(--warn)}.sig.t-ok .sv{color:var(--success)}
.sig .sw{font-size:12.5px;color:var(--text-secondary)}
.sig .sgo{font-size:12px;white-space:nowrap}
@media (max-width:820px){.sig{grid-template-columns:10px 1fr auto}.sig .sw{grid-column:2/4}.sig .sgo{grid-column:2/4}}

.features .fgroup{margin:0 0 18px}
.features .fghead{display:flex;align-items:center;gap:10px;padding:6px 0 4px}
.frow{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(90px,.7fr) 3fr minmax(80px,auto);gap:4px 18px;align-items:baseline;padding:8px 0;border-top:1px solid var(--hair)}
.frow .fn{font-weight:500;color:var(--text)}
.frow .fa{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.04em}
.frow .fnote{font-size:12.5px;color:var(--text-secondary)}
.frow .flinks a{font-size:11.5px;margin-left:10px;font-family:var(--font-mono)}
.frow .fs{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right}
@media (max-width:820px){.frow{grid-template-columns:1fr auto}.frow .fnote{grid-column:1/3}}

.milestones{margin:4px 0 8px}
.ms{padding:12px 0 10px;border-top:1px solid var(--hair)}
.ms .mh{display:flex;align-items:baseline;gap:12px}
.ms .mn{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
.ms h4{font-family:var(--font-display);font-size:15px;margin:0;font-weight:600}
.ms .mw{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.ms .mb{margin:6px 0 8px;font-size:13.5px;color:var(--text-secondary);max-width:var(--measure-prose)}
.gates{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.gate{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);border:0}
a.gate:hover{color:var(--primary)}
.gate .gg{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--hair-strong);flex:none;display:inline-block}
.gate.g-done .gg{background:var(--success);border-color:var(--success)}
.gate.g-active .gg{background:var(--accent);border-color:var(--accent)}
.gate.g-blocked .gg{background:var(--danger);border-color:var(--danger);border-radius:1px}
.gate.g-decision .gg{border-color:var(--danger);background:transparent;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 9px var(--danger)}
.gate.g-decision{color:var(--danger)}
.gate.g-done{color:var(--text-muted)}

.lanes{margin:8px 0 14px;overflow-x:auto}
.lanes h4{font-family:var(--font-display);font-size:14px;margin:0 0 8px}
.lane{display:grid;grid-template-columns:minmax(150px,220px) repeat(var(--n),minmax(14px,1fr)) 44px;gap:3px;align-items:center;padding:3px 0}
.lane .ll{font-size:12.5px;color:var(--text-secondary);padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .ll a{color:inherit}.lane .ll a:hover{color:var(--primary)}
.lane .lc{height:14px;border-radius:2px;background:color-mix(in srgb,var(--primary) calc(var(--i) * 100%),var(--well))}
.lane.t-danger .lc{background:color-mix(in srgb,var(--danger) calc(var(--i) * 100%),var(--well))}
.lane.t-warn .lc{background:color-mix(in srgb,var(--warn) calc(var(--i) * 100%),var(--well))}
.lane.t-ok .lc{background:color-mix(in srgb,var(--success) calc(var(--i) * 100%),var(--well))}
.lane .ln{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-align:right;font-variant-numeric:tabular-nums}
.lane.lhead{padding-bottom:2px}
.lane.lhead .ld{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);text-align:center;letter-spacing:.02em;line-height:1.2}

.wsl{margin:4px 0}
.ws .shead{gap:12px;padding-top:12px}
.ws[data-collapsed="1"] .shead{padding-top:12px}
.ws .shead h2{font-size:15.5px}
.ws .shead .badge{margin:0}
.ws .spark{width:70px;height:16px;flex:none}
.ws .spark rect.on{fill:var(--primary)}.ws .spark rect.off{fill:var(--hair-strong)}
.ws-blocked .spark rect.on{fill:var(--danger)}.ws-done .spark rect.on{fill:var(--success)}.ws-stalled .spark rect.on{fill:var(--warn)}
.ws .wsn{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
.ws .wstate{margin:0 0 10px 30px;font-size:13.5px;color:var(--text-secondary);max-width:var(--measure-prose)}
.ws .sbody{margin-left:30px}
.ws .wsum{max-width:var(--measure-prose)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;margin:4px 0 12px;padding:0}
.trio>div{padding:8px 0;border-top:1px solid var(--hair)}
.trio dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 0 3px}
.trio dd{margin:0;font-size:13.5px;color:var(--text-secondary)}
.trio>div.t-danger dt{color:var(--danger)}
.wdec{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 12px}
.wdec .wdl{font-size:12px;color:var(--text-muted);margin-right:6px}
.wdec a.badge{border-bottom:0;max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.wtl{margin:8px 0 12px}
.wday{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:6px 0;border-top:1px solid var(--hair)}
.wday .wd{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);padding-top:3px}
.wev{display:flex;align-items:baseline;gap:9px;padding:3px 0;font-size:13px}
.wev .wk{color:var(--text-muted);display:inline-flex;align-self:center}.wev .wk .ic{width:13px;height:13px}
.wev.t-danger .wk{color:var(--danger)}.wev.t-ok .wk{color:var(--success)}.wev.t-warn .wk{color:var(--warn)}
.wev .wref{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.wempty{font-size:12.5px;color:var(--text-muted);margin:6px 0 12px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--well);border:1px solid var(--hair);color:var(--text-secondary)}
.chip .ic{width:12px;height:12px;color:var(--text-muted)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
a.chip:hover{color:var(--primary);border-color:var(--primary)}
.jumped{animation:jumpflash 1.4s var(--ease-out)}
@keyframes jumpflash{0%{box-shadow:inset 3px 0 0 var(--primary)}100%{box-shadow:inset 3px 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.jumped{animation:none}}

/* ── picker ──────────────────────────────────────────────────────────────
   A set the reader keeps or drops. Follows the surface language the rest of
   the runtime uses: whitespace, then a shared background, then one hairline.
   No boxes. The only sticky element is the action bar, because a reader
   working through several hundred items needs the running count and the
   filter in reach without scrolling back to the top. */
.pick{ margin:18px 0; }
.pickhead h4{ font-family:var(--font-display); font-size:17px; margin:0 0 10px; }

.pickbar{
  position:sticky; top:0; z-index:6;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:10px 0; margin-bottom:4px;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.pickfilter{
  flex:1 1 260px; min-width:0;
  font-family:var(--font-sans); font-size:13px; color:var(--text);
  background:var(--surface); border:1px solid var(--border); border-radius:3px;
  padding:7px 10px;
}
